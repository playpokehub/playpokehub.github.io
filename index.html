<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build and battle-test Pokémon teams for Showdown's formats: OU, Ubers, VGC, National Dex, doubles and more.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%227%22%20fill%3D%22%23ffcb05%22%20stroke%3D%22%2315171c%22%20stroke-width%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M1%208h14%22%20stroke%3D%22%2315171c%22%20stroke-width%3D%221.5%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%222.2%22%20fill%3D%22%23fff%22%20stroke%3D%22%2315171c%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<title>PokéHub</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  /* Night stadium, dark only (docs/superpowers/specs/2026-10-07-night-stadium-redesign-design.md) */
  color-scheme: dark;
  --bg: #0b1020;
  --s1: #121a30;
  --s2: #1a2440;
  --s3: #243050;
  --line: #26314f;
  --ink: #eef3ff;
  --ink-2: #aab6d6;
  --ink-3: #909cc0;
  --acc: #38d6ff;
  --acc-ink: #03141c;
  --hp: #4cd889;
  --low: #ff6b5e;
  --tera: #c79a3c;
  --r: 22px; --pill: 999px;
  --shadow: 0 18px 44px rgba(3, 6, 18, .55), 0 2px 6px rgba(3, 6, 18, .35);
  --ring: inset 0 0 0 1px var(--line);
  /* motion: springs generated with Motion's spring() (bounce .3 / 0, visualDuration .4s); off under reduced motion */
  --spring: linear(0, 0.053, 0.178, 0.335, 0.496, 0.643, 0.767, 0.866, 0.939, 0.99, 1.022, 1.039, 1.045, 1.045, 1.04, 1.034, 1.026, 1.019, 1.013, 1.008, 1.004, 1.001, 1, 0.998, 1);
  --spring-t: .65s;
  --spring-soft: linear(0, 0.06, 0.186, 0.329, 0.466, 0.584, 0.682, 0.76, 0.821, 0.868, 0.903, 0.929, 0.949, 0.963, 0.973, 0.981, 0.986, 0.99, 0.993, 0.995, 0.997, 0.998, 0.998, 0.999, 1);
  --spring-soft-t: .72s;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --t-fast: .12s; --t-med: .22s; --t-slow: .4s;
  --font: "Outfit", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* supporting tokens: raised lines, focus ring, the win/loss scale (blue/green good, red bad), buttons, warnings */
  --line-2: #34406a; --focus: var(--acc);
  --btn: var(--s2); --btn-hover: var(--s3); --btn-shadow: rgba(3, 6, 18, .6); --danger-ink: var(--low);
  --win-3: #9ccbff; --win-2: var(--hp); --win-1: #1d3a66;
  --neutral: #2a3352;
  --loss-1: #5e2330; --loss-2: var(--low); --loss-3: #ff9aa4;
  --on-strong: #03141c; --on-soft: #eef3ff;
  --warn-bg: #3a2e0c; --warn-ink: #ffd98a;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 600 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  background: var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* ---------- dock + status pill (src/ui/nav.js) ---------- */
.app { display: grid; grid-template-columns: 104px minmax(0, 1fr); min-height: 100vh; }
.dock { position: sticky; top: 0; height: 100vh; z-index: 5; display: grid; grid-template-rows: auto 1fr; justify-items: center; padding: 20px 0; }
.dock-logo { font: 900 20px/1 var(--font); letter-spacing: -.02em; color: var(--ink); text-decoration: none; padding: 6px; border-radius: var(--pill); }
.dock-logo b { color: var(--acc); }
.dock-list { list-style: none; margin: 0; padding: 10px; display: grid; gap: 6px; align-self: center; background: var(--s1); border-radius: var(--pill); box-shadow: var(--ring); }
.dk { position: relative; width: 54px; height: 54px; border-radius: var(--pill); display: grid; place-items: center; color: var(--ink-3);
  transition: transform var(--spring-t) var(--spring), background-color var(--t-fast), color var(--t-fast); }
.dk svg { width: 24px; height: 24px; }
.dk:hover, .dk:focus-visible { transform: scale(1.22); color: var(--ink); background: var(--s2); }
.dock-list li:has(+ li .dk:hover) .dk, .dock-list li:has(.dk:hover) + li .dk { transform: scale(1.09); }
.dk.on { background: var(--acc); color: var(--acc-ink); }
.dk-l { position: absolute; left: calc(100% + 14px); white-space: nowrap; font: 700 13px/1 var(--font); color: var(--ink); background: var(--s3); padding: 7px 12px;
  border-radius: var(--pill); box-shadow: var(--shadow); opacity: 0; translate: -6px 0; pointer-events: none;
  transition: opacity var(--t-fast), translate var(--spring-t) var(--spring); }
.dk:hover .dk-l, .dk:focus-visible .dk-l { opacity: 1; translate: 0 0; }
.status-pill { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: fit-content; margin: 0 0 18px auto; padding: 5px 5px 5px 16px;
  background: var(--s1); border-radius: var(--pill); box-shadow: var(--ring); position: relative; z-index: 6; }
.engine { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.engine::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.engine.ok::before { background: var(--hp); }
.engine.bad { color: var(--low); }
.engine.bad::before { background: var(--low); }

/* ---------- layout ---------- */
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 24px 28px 64px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { .split { grid-template-columns: 1fr; } }
.panel { background: var(--s1); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; box-shadow: var(--ring); }
.controls { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; }
@media (max-width: 880px) { .controls { position: static; max-height: none; } }
.panel h2 { font: 800 26px/1.1 var(--font); letter-spacing: -.02em; }
.lede { color: var(--ink-2); font-size: 14px; }
.results { display: grid; gap: 18px; min-width: 0; }
.results-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.results-h h2, .intro h2 { font: 800 clamp(24px, 3vw, 32px)/1.1 var(--font); letter-spacing: -.02em; }
/* S/V slanted label: a parallelogram tag (the text itself stays upright) */
.eyebrow { display: block; width: fit-content; font: 700 13px/1.2 var(--font); color: var(--ink-3); margin-bottom: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.box { background: var(--s1); border-radius: var(--r); box-shadow: var(--ring); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.box h3 { font-size: 16px; }
.alt-h { font-size: 18px; margin-top: 8px; }

/* ---------- form ---------- */
.field { display: grid; gap: 6px; }
.field label, .flabel { font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="number"], input:not([type]), select, textarea { width: 100%; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; }
input[type="text"]:focus, input[type="number"]:focus, input:not([type]):focus, select:focus, textarea:focus { border-color: var(--acc); outline: none; box-shadow: 0 0 0 3px rgba(56, 214, 255, .2); }
textarea { resize: vertical; font-size: 13px; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
.hint { font-size: 12px; color: var(--ink-3); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { appearance: none; border: 0; background: var(--btn); color: var(--ink); padding: 9px 16px; border-radius: var(--pill); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--ring), 0 2px 0 var(--btn-shadow); transition: box-shadow .12s, background .12s, filter .12s; }
.btn:hover:not(:disabled) { background: var(--btn-hover); box-shadow: inset 0 0 0 1px var(--line-2), 0 2px 0 var(--btn-shadow); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: var(--ring), 0 1px 0 var(--btn-shadow); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: progress; }
.btn-primary { background: var(--acc); color: var(--acc-ink); font: 800 16px/1.1 var(--font); padding: 11px 22px; box-shadow: none; }
.btn-primary:hover:not(:disabled) { background: var(--acc); filter: brightness(1.08); box-shadow: none; }
.btn-primary:active:not(:disabled) { box-shadow: none; }
.btn-ghost { background: transparent; color: var(--ink); padding: 7px 14px; box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-ghost:hover:not(:disabled) { background: var(--btn-hover); box-shadow: inset 0 0 0 1px var(--ink-3); }
.btn-ghost.on { box-shadow: inset 0 0 0 1px var(--acc); color: var(--ink); }
.btn-danger { background: transparent; color: var(--danger-ink); box-shadow: inset 0 0 0 1px rgba(255, 92, 108, .55); }
.btn-danger:hover:not(:disabled) { background: var(--loss-2); box-shadow: none; color: var(--on-strong); }
.btn-danger.armed { background: var(--loss-2); box-shadow: none; color: var(--on-strong); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-primary.btn-sm { font-size: 15px; padding: 6px 16px; }
.seg { display: flex; flex-wrap: wrap; background: var(--s2); border-radius: var(--pill); box-shadow: var(--ring); padding: 4px; gap: 4px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 7px 12px; border-radius: var(--pill); font-size: 13px; font-weight: 800; color: var(--ink-2); cursor: pointer; }
.seg button:hover:not(.on) { color: var(--ink); background: var(--btn-hover); }
.seg button.on { background: var(--acc); color: var(--acc-ink); }
.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.tg { flex: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line-2); position: relative; transition: background .15s; margin-top: 1px; }
.tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s, background .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.toggle input:checked + .tg { background: var(--acc); }
.toggle input:checked + .tg::after { background: var(--acc-ink); }
.toggle input:checked + .tg::after { transform: translateX(14px); }
.toggle input:focus-visible + .tg { outline: 2px solid var(--focus); outline-offset: 2px; }
.tg-l { display: block; font-weight: 600; font-size: 14px; }
.tg-h { display: block; font-size: 12px; color: var(--ink-3); }
.chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.chip-input:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(56, 214, 255, .2); }
.chip-input input:not([type]):focus, .chip-input input[type="text"]:focus { box-shadow: none; }
.chip-input input { flex: 1 1 120px; min-width: 0; width: auto; border: 0; background: transparent; padding: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--pill); padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 600; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); font-size: 16px; line-height: 1; padding: 0 4px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); border-radius: var(--pill); padding: 4px 11px; font-size: 12px; font-weight: 800; cursor: pointer; }
.chip-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.chip-btn.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
details.more > summary, details.sample > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 4px 0; }
details.more[open] { display: grid; gap: 12px; }
.move-locks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.progress { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); background: var(--s2); border-radius: var(--r); box-shadow: var(--ring); padding: 9px 14px; }
.spinner { width: 14px; height: 14px; flex: none; border: 2px solid var(--line-2); border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--r); padding: 9px 12px; font-size: 13px; }
.note { font-size: 12px; color: var(--ink-3); }

/* ---------- gimmick plan ---------- */
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; margin: 0; background: var(--s1); box-shadow: var(--ring); border-radius: var(--r); overflow: hidden; }
.plan div { padding: 10px 14px; border-right: 1px solid var(--line); }
.plan div:last-child { border-right: 0; }
.plan dt { font: 700 13px/1 var(--font); color: var(--ink-3); margin-bottom: 5px; }
.plan dd { margin: 0; font: 800 15px/1.2 var(--font); }

/* ---------- set card ---------- */
.card { background: var(--s1); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--ring); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-title { min-width: 0; }
.card-title h3 { font: 800 19px/1.2 var(--font); letter-spacing: -.01em; }
.sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.lead-tag { display: inline-block; font: 800 12px/1 var(--font); background: var(--acc); color: var(--acc-ink); padding: 4px 9px; border-radius: var(--pill); margin-bottom: 5px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.abil { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tera-note { font-size: 12px; }
.type { display: inline-block; background: var(--tc); color: var(--tt); font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: var(--pill); letter-spacing: .02em; }
.type-sm { font-size: 11px; padding: 1px 6px; }
.tdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--tc); margin-right: 7px; flex: none; transform: translateY(0); }
.moves { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; font-weight: 500; }
.moves li { display: flex; align-items: center; min-width: 0; }
.spread { font-size: 12px; color: var(--ink-2); }
.stats { display: grid; gap: 3px; }
.stat { display: grid; grid-template-columns: 38px 1fr 36px 30px; gap: 8px; align-items: center; font-size: 12px; }
.stat-l { color: var(--ink-3); font-weight: 600; }
.stat-l em { font-style: normal; margin-left: 2px; }
.stat-l .up { color: var(--win-2); }
.stat-l .down { color: var(--loss-2); }
.stat-bar { height: 6px; background: var(--s3); border-radius: var(--pill); overflow: hidden; }
.stat-bar i { display: block; height: 100%; background: var(--acc); border-radius: var(--pill); }
.stat-v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.stat-ev { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; }
.why { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--acc); padding-left: 10px; }
.handles { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; }
.handles .k, .calc .k { font: 700 12px/1.2 var(--font); color: var(--ink-3); margin-right: 2px; }
.h-chip { background: var(--s2); border: 1px solid var(--line); border-radius: var(--pill); padding: 1px 8px; }
.h-chip.rival { border-color: var(--ink-2); font-weight: 700; }
.card-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.set-paste { margin: 0; padding: 10px 12px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r);
  font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.gim { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 800 13px/1 var(--font); padding: 5px 11px; border-radius: var(--pill); border: 2px solid var(--line-2); white-space: nowrap; }
.gim-mega { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.gim-ultra { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.gim-z { background: var(--s1); color: var(--ink); border-color: var(--acc); border-style: double; border-width: 3px; }
.gim-dynamax { background: #c4214f; border-color: #8e1236; color: #fff; }
.gim-tera { background: var(--s1); color: var(--ink); border-color: var(--tc); }
.gim-tera .gem { width: 9px; height: 9px; background: var(--tc); transform: rotate(45deg); display: inline-block; }
.gim-primal { background: var(--s2); color: var(--ink-2); border-color: var(--line-2); }

/* ---------- win / loss encoding (diverging blue ↔ red) ---------- */
.pchip { display: inline-block; min-width: 44px; text-align: center; font: 600 12px/1 var(--mono); padding: 4px 6px; border-radius: 4px; }
.p-w3 { background: var(--win-3); color: var(--on-strong); }
.p-w2 { background: var(--win-2); color: var(--on-strong); }
.p-w1 { background: var(--win-1); color: var(--on-soft); }
.p-n { background: var(--neutral); color: var(--on-soft); }
.p-l1 { background: var(--loss-1); color: var(--on-soft); }
.p-l2 { background: var(--loss-2); color: var(--on-strong); }
.p-l3 { background: var(--loss-3); color: var(--on-strong); }
.threats, .mgrid, .kos, .calc { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.threats li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; font-size: 14px; }
.threats li .muted { grid-column: 2; font-size: 12px; }
.rv { font-style: normal; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.mgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 12px; font-size: 13px; max-height: 520px; overflow: auto; }
.mgrid li { display: flex; gap: 8px; align-items: center; }
.kos li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.winbars { display: grid; gap: 8px; }
.wb-axis { font-size: 11px; color: var(--ink-3); }
.wb-scale { position: relative; height: 14px; }
.wb-scale b { position: absolute; top: 0; font-weight: 400; }
.wb-scale b:nth-child(1) { left: 0; }
.wb-scale b:nth-child(2) { left: 50%; transform: translateX(-50%); }
.wb-scale b:nth-child(3) { right: 0; }
.wb { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.wb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb-track { position: relative; height: 14px; background: var(--s2); border-radius: var(--pill); overflow: hidden; }
.wb-mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); opacity: .6; }
.wb-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.wb-fill.win { background: var(--win-2); }
.wb-fill.loss { background: var(--loss-2); }
.wb-pending { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, var(--line) 0 4px, transparent 4px 8px); opacity: .7; }
.wb-v { font: 600 13px var(--mono); text-align: right; }

/* ---------- counter ---------- */
.target { background: var(--s1); border: 1px dashed var(--line-2); border-radius: var(--r); padding: 12px 14px; }
.target-card { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.target-card p { flex-basis: 100%; }
.facts { display: grid; gap: 8px; background: var(--s2); border-radius: var(--r); padding: 10px; }

/* ---------- simulate ---------- */

.log { display: grid; gap: 8px; max-height: 560px; overflow: auto; padding-right: 4px; }

/* ---------- intro ---------- */
.intro { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: grid; gap: 12px; max-width: 760px; }

.rules-set legend { padding: 0; margin-bottom: 8px; }
/* Trainer account (src/ui/account.js): badge in the status pill (top right), hover card, trainer-card dialog */
.ac-corner { position: relative; }
.ac-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 80px; height: 32px; padding: 0 7px 0 4px; border: 0;
  border-radius: 99px; cursor: pointer; color: var(--ink); background: var(--s2); box-shadow: var(--ring);
  transition: transform var(--t-fast, .12s) ease-out, background-color .15s; }
.ac-btn.out { padding: 0 8px; }
.ac-btn:hover { background: var(--s1); transform: scale(1.04); }
.ac-btn:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.ac-btn .ac-ball { background: #f4f4f6; border-radius: 50%; }

/* profile picture: the trainer sprite's head, cropped into a circle */
.ac-av { position: relative; display: inline-block; flex: none; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 30%, #33504c, #172624); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .18); }
.ac-av img { position: absolute; left: 50%; top: -10%; width: 290%; max-width: none; transform: translateX(-50%); image-rendering: pixelated; }
.ac-ball { display: block; color: #1e1b0c; flex: none; }
.ac-ball.off { color: var(--ink-3); }

.ac-tip { position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; width: 280px; max-width: calc(100vw - 32px); max-height: calc(100vh - 120px); overflow: auto; padding: 14px; display: grid; gap: 8px;
  background: var(--s1); border-radius: var(--r); box-shadow: var(--shadow), var(--ring);
  opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none; }
.ac-corner:hover .ac-tip, .ac-btn:focus-visible + .ac-tip { opacity: 1; visibility: visible; transform: none; }
@media (hover: none) { .ac-tip { display: none; } }

.ac-ach { display: grid; gap: 8px; }
.ac-rank { display: flex; align-items: center; gap: 10px; }
.ac-rname { display: flex; align-items: center; gap: 5px; }
.ac-rname .ac-ball { background: #f4f4f6; border-radius: 50%; }
.ac-name { font: 800 16px/1.15 var(--font); overflow-wrap: anywhere; }
.ac-rname { font-size: 13px; color: var(--ink-2); }
.ac-bar { height: 6px; border-radius: 99px; background: var(--s2); overflow: hidden; }
.ac-bar i { display: block; height: 100%; background: var(--acc); border-radius: inherit; }
.ac-stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 2px 0 0; font-size: 13px; }
.ac-stats div { display: contents; }
.ac-stats dt { color: var(--ink-3); }
.ac-stats dd { margin: 0; text-align: right; }

.ac-dlg { width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0; border-radius: var(--r);
  background: var(--s1); color: var(--ink); box-shadow: var(--shadow), var(--ring); }
.ac-dlg::backdrop { background: rgba(4, 10, 9, .6); }
.ac-dlg-in { display: grid; gap: 14px; padding: 20px; }
.ac-dlg-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ac-dlg h2 { font: 800 22px/1.1 var(--font); }
.ac-dlg h3 { font-size: 15px; }
.ac-form { display: grid; gap: 12px; }

.ac-earned { font-size: 14px; }
.ac-earned b { color: var(--acc); }
.ac-up { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.ac-up .ac-ball { background: #f4f4f6; border-radius: 50%; }

.ac-avs { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.ac-av-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.ac-av-opt { position: relative; display: grid; justify-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: var(--r); cursor: pointer;
  background: var(--s2); box-shadow: var(--ring); }

.ac-change { justify-self: start; }
.ac-who { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Build: Showdown-style teambuilder (builder.js) ---------- */
.bd { display: grid; gap: 18px; }
.bd-top { gap: 12px; }

.bd-field { display: grid; gap: 4px; min-width: 0; }

.bd-teamname { flex: 1 1 180px; max-width: 280px; }
.bd-teamacts { flex: 10 1 auto; }
.btn.on { box-shadow: inset 0 0 0 2px var(--acc); }
.bd-io { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }

.bd-main { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .bd-main { grid-template-columns: minmax(0, 1fr); } }

/* team slots */
.bd-slots { display: grid; gap: 8px; position: sticky; top: 20px; }
@media (max-width: 880px) { .bd-slots { position: static; } }
.bd-slots ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.bd-slot { appearance: none; width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; color: var(--ink);
  padding: 8px 12px 8px 8px; border: 0; box-shadow: var(--ring); border-radius: var(--r); background: var(--s1); cursor: pointer; }
.bd-slot .spr { border-radius: 50%; background: radial-gradient(circle at 50% 58%, var(--s3) 0 60%, transparent 61%); }
.bd-slot:hover { background: var(--s2); }

.bd-slot-m { color: var(--ink-2); }
.bd-slot-q { display: grid; place-items: center; width: 40px; height: 40px; border: 2px dashed var(--line-2); border-radius: 50%; color: var(--ink-3); font: 800 16px/1 var(--font); }
.bd-add { justify-self: stretch; box-shadow: inset 0 0 0 2px var(--line-2); background: transparent; }
.bd-empty { gap: 10px; }

/* editor */
.bd-editor { gap: 16px; padding: 18px 20px; }
.bd-edit-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
.bd-edit-name { flex: 1 1 220px; display: grid; gap: 6px; min-width: 0; }
.bd-types { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.bd-edit-acts { margin-left: auto; }
.bd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px 12px; }
.bd-f-level input { max-width: 110px; }
.bd-moves { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; min-width: 0; }
.bd-moves legend { padding: 0; margin-bottom: 6px; }
.bd-moves .flabel { font-size: 12px; }
@media (max-width: 520px) { .bd-moves { grid-template-columns: minmax(0, 1fr); } }
.bd-field input[aria-expanded="true"] { border-color: var(--acc); background: var(--s1); }
.bd-problems { margin: 0; padding: 8px 10px 8px 28px; display: grid; gap: 2px; }

/* chooser (the pick list) */
.bd-chooser { display: grid; gap: 6px; border-radius: var(--r); background: var(--s2); box-shadow: var(--ring); padding: 12px; min-width: 0; }
.bd-chooser-t { font: 800 15px/1.2 var(--font); color: var(--ink-2); }
.bd-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; max-height: 420px; overflow: auto; overscroll-behavior: contain; }
.bd-group { font: 800 13px/1 var(--font); color: var(--ink-3); padding: 8px 4px 2px; }
.bd-row { appearance: none; width: 100%; display: grid; gap: 2px 10px; align-items: center; text-align: left; padding: 7px 10px; color: var(--ink);
  border: 0; border-radius: var(--pill); background: var(--s1); cursor: pointer; font-size: 13px; min-width: 0; }
.bd-row:hover { background: var(--btn-hover); }
.bd-row.on { box-shadow: inset 4px 0 0 var(--acc), inset 0 0 0 1px var(--acc); }
.bd-name { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.bd-tag { display: inline-block; margin-left: 6px; font: 800 10px/1 var(--font); letter-spacing: .05em; text-transform: uppercase; color: var(--acc);
  border: 1px solid color-mix(in srgb, var(--acc) 50%, transparent); border-radius: var(--pill); padding: 2px 6px; vertical-align: 1px; }
.bd-desc { color: var(--ink-2); font-size: 12px; min-width: 0; }
.bd-num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.bd-head { font: 800 12px/1.2 var(--font); color: var(--ink-3); padding: 0 8px; }
.bd-head > * { min-width: 0; }

/* species rows */
.bd-row-sp { grid-template-columns: 40px minmax(90px, 1.3fr) minmax(90px, 1fr) minmax(0, 1.6fr) minmax(210px, 2fr); }
.bd-abil { font-size: 12px; color: var(--ink-2); }
.bd-abil i { font-style: normal; text-decoration: underline dotted; text-underline-offset: 2px; }
.bd-bs, .bd-bs-h { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)) 1.2fr; gap: 2px; font: 12px/1.2 var(--mono); text-align: right; }
.bd-bs b { font-weight: 700; }
.bd-head.bd-row-sp { display: grid; gap: 2px 10px; }
@media (max-width: 760px) {
  .bd-row-sp { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .bd-row-sp .bd-abil, .bd-row-sp .bd-bs { grid-column: 2 / -1; }
  .bd-head.bd-row-sp { display: none; }
}

/* move rows */
.bd-row-mv { grid-template-columns: minmax(110px, 1.6fr) 74px 70px 48px 64px 36px; }
.bd-row-mv .bd-desc { grid-column: 1 / -1; }
.bd-head.bd-row-mv { display: grid; gap: 2px 10px; padding: 0; }
.bd-sort { appearance: none; border: 1px solid transparent; background: transparent; border-radius: var(--pill); padding: 4px 8px; text-align: left;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
.bd-sort:nth-child(n+4) { text-align: right; }
.bd-sort:hover { border-color: var(--line-2); }
.bd-sort.on { color: var(--acc-ink); border-color: var(--acc); background: var(--acc); }
.bd-cat { font-size: 12px; font-weight: 600; color: var(--ink-2); }
@media (max-width: 560px) {
  .bd-row-mv { grid-template-columns: minmax(0, 1fr) auto; }
  .bd-row-mv > span:nth-child(n+3):not(.bd-desc) { display: none; }
  .bd-row-mv .bd-desc::before { content: attr(data-meta); }
  .bd-head.bd-row-mv { grid-template-columns: repeat(3, auto); justify-content: start; }
}

/* item / ability rows */
.bd-row-it, .bd-row-ab { grid-template-columns: minmax(120px, 1fr) minmax(0, 2.4fr); }
@media (max-width: 560px) { .bd-row-it, .bd-row-ab { grid-template-columns: minmax(0, 1fr); } }

/* stats: nature, EV sliders, IVs */
.bd-stats { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.bd-stats-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 14px; margin-bottom: 4px; }
.bd-stats-top h3 { font: 800 18px/1.2 var(--font); margin-right: auto; align-self: center; }
.bd-f-nature { flex: 1 1 220px; max-width: 320px; }
.bd-stat { display: grid; grid-template-columns: 42px 34px minmax(40px, 1fr) 64px minmax(120px, 2fr) 52px 44px; gap: 8px; align-items: center; }
.bd-stat-h { font: 800 12px/1 var(--font); color: var(--ink-3); }
.bd-stat-h > span:nth-child(n+2) { text-align: right; }
.bd-stat-h > span:nth-child(3), .bd-stat-h > span:nth-child(5) { text-align: left; }
.bd-st-l { font-weight: 800; font-size: 13px; }
.bd-st-l.up { color: var(--win-3); }
.bd-st-l.down { color: var(--loss-3); }
.bd-st-base, .bd-st-v { text-align: right; font-size: 13px; }
.bd-st-v { font-weight: 700; font-size: 14px; }
.bd-st-bar { height: 8px; background: var(--s3); border-radius: var(--pill); overflow: hidden; }
.bd-st-bar i { display: block; height: 100%; border-radius: var(--pill); background: var(--acc); }
.bd-st-bar i.hi { background: var(--win-2); }
.bd-st-bar i.lo { background: var(--loss-2); }
.bd-stat input[type="number"] { padding: 5px 6px; text-align: right; font-family: var(--mono); font-size: 13px; }
.bd-ev-r { width: 100%; accent-color: var(--acc); margin: 0; }
.bd-left { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.bd-left.over { color: var(--loss-3); font-weight: 700; }
@media (max-width: 560px) {
  .bd-stat { grid-template-columns: 38px 30px minmax(0, 1fr) 58px 48px 40px; grid-template-areas: "l b bar ev iv v" "r r r r r r"; row-gap: 2px; }
  .bd-st-l { grid-area: l; } .bd-st-base { grid-area: b; } .bd-st-bar { grid-area: bar; } .bd-ev-n { grid-area: ev; }
  .bd-ev-r { grid-area: r; } .bd-iv-n { grid-area: iv; } .bd-st-v { grid-area: v; }
  .bd-stat-h { grid-template-areas: "l b bar ev iv v"; }
  .bd-stat-h > span:nth-child(5) { display: none; }
  .bd-stat-h > span:nth-child(1) { grid-area: l; } .bd-stat-h > span:nth-child(2) { grid-area: b; } .bd-stat-h > span:nth-child(3) { grid-area: bar; }
  .bd-stat-h > span:nth-child(4) { grid-area: ev; } .bd-stat-h > span:nth-child(6) { grid-area: iv; } .bd-stat-h > span:nth-child(7) { grid-area: v; }
}

/* Dex Draft */
.dd-intro, .dd-draft { display: grid; gap: 16px; }
.dd-team { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.dd-team li { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 82px; padding: 6px 4px; border-radius: var(--r);
  background: var(--s2); box-shadow: var(--ring); font: 800 12px/1.2 var(--font); text-align: center; overflow-wrap: anywhere; }
.dd-team li.on { box-shadow: inset 0 0 0 2px var(--acc); }

.dd-offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.dd-card { display: grid; align-content: start; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--s2);
  box-shadow: var(--ring); transition: box-shadow var(--t-med), opacity var(--t-med); }

.dd-who { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.dd-who b { display: block; font: 800 18px/1.2 var(--font); }
.dd-who .spr { flex: none; }
.dd-card.mine .dd-who .spr { animation: gt-land .35s cubic-bezier(.2, 1.6, .5, 1); }
.dd-mystery { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--s1);
  box-shadow: var(--ring); font: 800 24px/1 var(--font); color: var(--ink-3); }
.dd-types { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dd-tag { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; background: var(--acc); color: var(--acc-ink); font-size: 12px; font-weight: 800; }
.dd-entry { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); }

.dd-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
.dd-opts { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; margin-top: 12px; }
.dd-sets { margin-bottom: 12px; }
.dd-setlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.dd-set { display: grid; gap: 3px; text-align: left; padding: 10px 12px; border: 0; border-radius: var(--r); cursor: pointer; color: var(--ink);
  background: var(--s2); box-shadow: var(--ring); font: inherit; }

@media (max-width: 880px) {
  .dd-offers { grid-template-columns: minmax(0, 1fr); }
  .dd-team { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
/* online: everyone's progress */

/* ---------- format picker (formats.js) ---------- */
.fmt-pick select { width: 100%; }
.fmt-facts { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- team preview (play.js) ---------- */

@media (max-width: 720px) { .tp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .tp-grid { grid-template-columns: 1fr; } }
.tp-mon { appearance: none; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center;
  text-align: left; padding: 10px 12px; color: var(--ink); border: 0; box-shadow: var(--ring); border-radius: var(--r); background: var(--s2); min-height: 72px; cursor: pointer; }
.tp-mon:hover:not(:disabled) { background: var(--btn-hover); }
.tp-mon.on { box-shadow: inset 0 0 0 2px var(--acc); background: color-mix(in srgb, var(--acc) 7%, var(--s2)); }
.tp-mon:disabled { cursor: default; }
.tp-mon .tp-n { font-weight: 800; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.tp-mon.on .tp-d { color: var(--ink-2); }
.tp-mon .tp-d { grid-column: 2; font-size: 12px; color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; }
.tp-badge { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center;
  font: 800 12px/1 var(--mono); background: var(--win-2); color: var(--on-strong); padding: 0 6px; }
.tp-badge.lead { background: var(--acc); color: var(--acc-ink); }
.tp-foe { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.tp-foe-mon { display: flex; align-items: center; gap: 6px; background: var(--s2); box-shadow: var(--ring); border-radius: var(--pill); padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 800; min-width: 0; }
.tp-foe-mon small { font-weight: 500; color: var(--ink-3); }
.pl-legal ul { margin: 2px 0 8px; padding-left: 18px; font-size: 13px; }

/* ---------- game plan ("how to use this team") ---------- */
.gp { background: var(--s1); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow), var(--ring); min-width: 0; overflow-wrap: anywhere; }
.gp-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
.gp-h .eyebrow { margin-bottom: 6px; }
.gp-h h2 { font: 800 clamp(22px, 2.6vw, 28px)/1.1 var(--font); letter-spacing: -.02em; }
.gp-sum { font-size: 15px; color: var(--ink-2); max-width: 72ch; }
.gp-k { font: 800 13px/1 var(--font); color: var(--ink-3); margin-bottom: 8px; }
.gp-btn { font-weight: 800; color: var(--ink); background: color-mix(in srgb, var(--acc) 22%, transparent); padding: 0 4px; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.gp-top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 880px) { .gp-top { grid-template-columns: 1fr; } }
.gp-lead { background: var(--s2); box-shadow: inset 5px 0 0 var(--acc), var(--ring); border-radius: var(--r); padding: 13px 16px 13px 20px; display: grid; gap: 4px; }
.gp-lead .gp-k { margin-bottom: 2px; }
.gp-lead-n { font: 800 20px/1.15 var(--font); }
.gp-lead-t { font-size: 14px; color: var(--ink-2); }
.gp-gim-box { min-width: 0; }
.gp-gims { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.gp-gim { display: flex; align-items: center; gap: 8px; background: var(--s2); box-shadow: var(--ring); border-radius: var(--pill); padding: 5px 14px 5px 5px; min-width: 0; max-width: 100%; }
.gp-gim-t { display: grid; line-height: 1.25; min-width: 0; }
.gp-gim-t b { font-size: 13px; font-weight: 800; }
.gp-gim-t span { font-size: 12px; color: var(--ink-3); }

.gp-members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.gp-m { box-shadow: var(--ring); border-radius: var(--r); padding: 16px; display: grid; gap: 9px; align-content: start; background: var(--s2); min-width: 0; }
.gp-m-h { display: flex; align-items: flex-start; gap: 10px; }
.gp-m-title { flex: 1; min-width: 0; }
.gp-m-title h4 { font: 800 18px/1.2 var(--font); letter-spacing: -.01em; }
.gp-lead-tag { margin: 0 0 0 4px; vertical-align: 2px; }
.gp-role { font: 800 13px/1.3 var(--font); color: var(--ink-3); margin-top: 3px; }
.gp-num { flex: none; width: 26px; height: 26px; display: grid; place-items: center; font: 800 13px/1 var(--font); background: var(--acc); color: var(--acc-ink); border-radius: 50%; }
.gp-types { display: flex; flex-wrap: wrap; gap: 4px; }
.gp-job { font-size: 14px; color: var(--ink-2); }

.gp-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; counter-reset: gp-step; }
.gp-steps li { position: relative; padding-left: 30px; font-size: 14px; line-height: 1.45; counter-increment: gp-step; }
.gp-steps li::before { content: counter(gp-step); position: absolute; left: 0; top: 1px; width: 21px; height: 21px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); font: 800 12px/21px var(--mono); text-align: center; }

.gp-facts { margin: 0; display: grid; gap: 7px; border-top: 1px dashed var(--line); padding-top: 9px; }
.gp-facts div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.gp-facts dt { font: 800 12px/1.7 var(--font); color: var(--ink-3); }
.gp-facts dd { margin: 0; color: var(--ink-2); }
.gp-weak { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
@media (max-width: 420px) { .gp-facts div { grid-template-columns: 1fr; gap: 2px; } }

.gp-sec { display: grid; gap: 10px; }
.gp-sec h3 { display: flex; align-items: center; gap: 9px; font: 800 20px/1.2 var(--font); }
.gp-sec h3::before { content: ""; flex: none; width: 6px; height: 18px; border-radius: 3px; background: var(--acc); transform: skewX(-14deg); }
.gp-mu { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gp-mu li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.gp-mu li:last-child { border-bottom: 0; padding-bottom: 0; }
.gp-mu-dot { display: inline-block; width: 44px; height: 8px; margin-top: 7px; border-radius: var(--pill); background: var(--neutral); }
.gp-mu-t { display: grid; gap: 2px; min-width: 0; }
.gp-arrow { margin: 0 6px; color: var(--ink-3); }
.gp-arrow::before { content: "\2192"; }
.gp-mu-x { color: var(--ink-2); font-size: 13px; }
.gp-tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.gp-tips li::marker { color: var(--acc); }

/* compact: lead + gimmicks + collapsed steps */
.gp-compact { gap: 12px; }
.gp-list { display: grid; gap: 6px; }
.gp-d { box-shadow: var(--ring); border-radius: var(--r); padding: 0 14px; background: var(--s2); }
.gp-d[open] { padding-bottom: 12px; display: grid; gap: 8px; }
.gp-d summary { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 9px 0; list-style: none; flex-wrap: wrap; }
.gp-d summary::-webkit-details-marker { display: none; }
.gp-d summary::after { content: "+"; margin-left: auto; font: 700 16px/1 var(--mono); color: var(--ink-3); }
.gp-d[open] summary::after { content: "\2212"; }
.gp-d summary b { font: 800 15px/1.2 var(--font); }
.gp-d .gp-role { margin-top: 0; }

/* Gauntlet */
.gt-intro, .gt-slots, .gt-edit, .gt-ladder { display: grid; gap: 16px; }
.gt-reels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .gt-reels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gt-reel { display: grid; justify-items: center; gap: 8px; padding: 12px 8px; border: 2px solid var(--line-2); border-radius: var(--r);
  background: linear-gradient(180deg, var(--s2), var(--s1)); text-align: center; font-size: 13px; }
.gt-reel b { font: 800 14px/1.2 var(--font); }
.gt-window { width: 100%; height: 108px; display: grid; place-items: center; overflow: hidden; border-radius: var(--r);
  background: repeating-linear-gradient(0deg, var(--s1) 0 18px, var(--s2) 18px 36px); box-shadow: inset 0 8px 12px rgba(0,0,0,.45), inset 0 -8px 12px rgba(0,0,0,.45); }
.gt-reel.spin .gt-window { box-shadow: inset 0 8px 12px rgba(0,0,0,.45), inset 0 -8px 12px rgba(0,0,0,.45), inset 0 0 0 2px var(--acc); }
.gt-reel.spin .gt-window .spr { animation: gt-roll .07s linear infinite; filter: blur(1.5px); }
@keyframes gt-roll { from { transform: translateY(-30%); } to { transform: translateY(30%); } }
.gt-reel:not(.spin) .gt-window .spr { animation: gt-land .35s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes gt-land { from { transform: translateY(-40%); } to { transform: translateY(0); } }
.gt-q { font: 800 40px/1 var(--font); color: var(--ink-3); }
.gt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gt-list li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 9px 14px;
  border-radius: var(--r); background: var(--s2); box-shadow: var(--ring); }
.gt-t b { font: 800 16px/1.2 var(--font); }
.gt-list li.now { background: color-mix(in srgb, var(--acc) 6%, var(--s2)); box-shadow: inset 0 0 0 2px var(--acc); }
.gt-list li.locked { opacity: .6; background: var(--s1); }
.gt-list li:last-child .gt-t b { color: var(--low); }
.gt-n { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--s1); box-shadow: var(--ring); font: 800 15px/1 var(--font); }
.gt-list li.beat .gt-n { background: var(--acc); color: var(--acc-ink); box-shadow: none; }
.gt-list li.now .muted { color: var(--ink-2); }
.gt-list li.now .gt-n { background: var(--acc); color: var(--acc-ink); box-shadow: none; }
.gt-t { display: grid; justify-items: start; }
.gt-bonus { margin-top: 4px; padding: 2px 10px; border-radius: var(--pill); font-size: 12px; font-weight: 800; color: var(--acc-ink); background: var(--acc); }
.gt-elo { font: 600 13px var(--mono); color: var(--ink-2); }
.gt-ok { color: var(--acc); font: 800 15px/1 var(--font); }
.gt-ok::before { content: "✓ "; }
.gt-lost { border-color: var(--loss-2); }
.gt-vs { margin: 0 0 12px; font-weight: 700; }
.gt-vs b { font: 800 17px/1 var(--font); color: var(--acc); margin-right: 4px; }

/* intro: the two kinds of run side by side (stacked on phones) */
.gt-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 12px; }
.gt-modes .pl-card { display: flex; flex-direction: column; gap: 8px; }
.gt-modes .pl-start { margin-top: auto; }
/* the two runs as big S/V tiles with a Pokémon peeking in */
.gt-mode { position: relative; overflow: hidden; min-height: 230px; padding: 20px 22px; color: var(--ink); box-shadow: var(--ring); }
.gt-modes .gt-mode-ou, .gt-modes .gt-mode-champ { background: var(--s1); } /* beats .pl-card (play.css loads later) */
.gt-mode::before { content: none; }
.gt-mode img { position: absolute; right: -10px; bottom: -18px; height: 190px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); pointer-events: none; }
.gt-mode .pl-card-t { position: relative; font-size: 30px; color: var(--ink); }
.gt-mode .pl-card-t::before { background: var(--acc); }
.gt-mode p { position: relative; max-width: 58%; color: var(--ink-2); font-weight: 600; }
.gt-mode .pl-start { position: relative; align-self: flex-start; background: var(--acc); color: var(--acc-ink); box-shadow: 0 6px 0 rgba(0, 0, 0, .22), 0 0 24px rgba(56, 214, 255, .3); }
.gt-mode .pl-start:hover:not(:disabled) { background: var(--acc); filter: brightness(1.05); box-shadow: 0 7px 0 rgba(0, 0, 0, .22), 0 0 28px rgba(56, 214, 255, .4); }

/* gauntlet / daily switch and the finished-daily screen */
.gt-wrap { display: grid; gap: 14px; }
.gt-slot-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.gt-slot-bar .seg { width: min(100%, 320px); }
.gt-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--low); vertical-align: middle; margin-left: 2px; }
.gt-streak b { font-size: 15px; color: var(--acc); }
.gt-daily-done { display: grid; gap: 14px; }
.gt-daily-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.gt-daily-stats div { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r); background: var(--s2); box-shadow: var(--ring); }
.gt-daily-stats b { font-size: 24px; }
.gt-daily-stats span { font-size: 12px; color: var(--ink-3); }

/* Daily challenge */
.gt-challenge { display: grid; gap: 14px; }
.gt-rules { margin: 0; padding-left: 18px; display: grid; gap: 2px; color: var(--ink-2); }
.gt-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.gt-won { border-color: var(--acc); }
.gt-sides .pl-mons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gt-leadpick li { padding: 0; background: none; box-shadow: none; }
.gt-lead { width: 100%; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 10px 3px 3px; border: 0; border-radius: var(--pill); cursor: pointer;
  background: var(--s1); box-shadow: var(--ring); color: var(--ink); font: inherit; font-size: 13px; font-weight: 800; text-align: left; }
.gt-lead > span:not(.spr) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-lead i { font-style: normal; font-weight: 500; color: var(--ink-3); }
.gt-lead:hover { background: var(--s2); }
.gt-lead.on { box-shadow: inset 0 0 0 2px var(--acc); }
.gt-lead-tag { flex: none; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--acc-ink); background: var(--acc); padding: 2px 6px; border-radius: var(--pill); }

/* Nuzlocke gauntlet */
.gt-reels-many { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 760px) { .gt-reels-many { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gt-reels-many .gt-window { height: 86px; }
.gt-nuz, .gt-nuz-intro { display: grid; gap: 14px; }
.gt-box { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 6px; }
.gt-boxmon { width: 100%; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 8px 3px 3px; border: 0; border-radius: var(--pill); cursor: pointer;
  background: var(--s2); box-shadow: var(--ring); color: var(--ink); font: inherit; font-size: 13px; font-weight: 800; text-align: left; }
.gt-boxmon > span:not(.spr) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-boxmon .spr-sm { flex: none; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 50% 55%, var(--s3) 0 62%, transparent 63%); }
.gt-boxmon:hover:not(:disabled) { background: var(--s1); }
.gt-boxmon:disabled { cursor: default; }
.gt-boxmon.on { box-shadow: inset 0 0 0 2px var(--acc); }
.gt-boxmon.dead { opacity: .45; filter: grayscale(1); }
.gt-boxtag { flex: none; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--acc-ink); background: var(--acc); padding: 2px 6px; border-radius: var(--pill); }
.gt-boxtag.dead { color: #fff; background: var(--loss-2); }
.gt-slot-bar .seg { width: min(100%, 440px); }

/* Home screen (src/ui/home.js): the lit stage, the move band, mode rows, your corner, the sign-off.
   Every animation here is decoration: under reduced motion all of it is switched off at the bottom of this file. */
@property --tint { syntax: "<color>"; inherits: true; initial-value: #38d6ff; }
.home { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; overflow-x: clip; padding-bottom: 8px; }

/* ---------- hero: copy on the left, the stage on the right ---------- */
.hm-hero { --mx: 0; --my: 0; position: relative; isolation: isolate; overflow: clip; display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
  min-height: clamp(560px, calc(100dvh - 118px), 760px); border-radius: var(--r); box-shadow: var(--ring);
  background: radial-gradient(90% 70% at 72% 105%, #182a55 0%, transparent 62%), linear-gradient(180deg, #0e1532, var(--bg) 70%); }
/* camera flashes in the stands */
.hm-hero::before, .hm-hero::after { content: ""; position: absolute; z-index: -1; top: 0; left: 0; width: 2px; height: 2px; border-radius: 50%; background: transparent; }
.hm-hero::before { box-shadow: 120px 40px #fff, 380px 90px #fff, 610px 30px #fff, 840px 120px #fff, 1010px 60px #fff, 260px 150px #fff, 730px 170px #fff, 1150px 140px #fff;
  animation: hm-flash 3.7s steps(1) infinite; }
.hm-hero::after { box-shadow: 60px 110px #fff, 300px 30px #fff, 520px 140px #fff, 690px 70px #fff, 930px 30px #fff, 1080px 170px #fff, 440px 60px #fff, 860px 190px #fff;
  animation: hm-flash 5.3s steps(1) 1.1s infinite; }
@keyframes hm-flash { 0%, 100% { opacity: 0; } 3% { opacity: .9; } 6% { opacity: 0; } 51% { opacity: .6; } 53% { opacity: 0; } }

.hm-copy { container-type: inline-size; position: relative; z-index: 2; display: grid; align-content: center; gap: 22px; padding: 48px 0 48px 52px; }
.hm-hi { font: 700 15px/1 var(--font); color: var(--ink-3); animation: hm-up .7s var(--ease-out) .1s backwards; }
.hm-copy h1 { font: 900 16.5cqi/.9 var(--font); letter-spacing: -.045em; }
.hm-l { display: block; white-space: nowrap; }
.hm-copy em { font-style: normal; color: var(--acc); }
.hm-w { display: inline-block; overflow: hidden; vertical-align: top; padding: .02em .04em .1em; margin: 0 -.04em -.1em; }
.hm-w > span { display: inline-block; animation: hm-rise 1s var(--spring-soft) calc(.18s + var(--i) * 75ms) backwards; }
@keyframes hm-rise { from { transform: translateY(110%) rotate(7deg); } }
.hm-sub { font-size: 18px; font-weight: 500; line-height: 1.45; color: var(--ink-2); max-width: 32ch; animation: hm-up .8s var(--ease-out) .7s backwards; }
.hm-ctas { display: flex; flex-wrap: wrap; gap: 12px; animation: hm-up .8s var(--ease-out) .82s backwards; }
@keyframes hm-up { from { opacity: 0; transform: translateY(18px); } }
.hm-go, .hm-alt { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; white-space: nowrap;
  padding: 16px 26px; border-radius: var(--pill); font: 800 17px/1 var(--font); }
.hm-go { background: var(--acc); color: var(--acc-ink); }
.hm-go svg { width: 20px; height: 20px; transition: transform var(--spring-t) var(--spring); }
.hm-go:hover svg { transform: rotate(-20deg) scale(1.15); }
/* a glint runs across the main button every few seconds, and again on hover */
.hm-go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%);
  transform: translateX(-120%); animation: hm-glint 4.5s var(--ease-out) 2s infinite; }
.hm-go:hover::after { animation: hm-glint .8s var(--ease-out); }
@keyframes hm-glint { 0% { transform: translateX(-120%); } 22%, 100% { transform: translateX(120%); } }
.hm-alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-2); transition: box-shadow var(--t-med), background-color var(--t-med); }
.hm-alt:hover { background: var(--s2); box-shadow: inset 0 0 0 1.5px var(--ink-3); }

/* ---------- the stage ---------- */
.hs { position: relative; min-height: 100%; perspective: 900px; transition: --tint .9s var(--ease-out); }
.hs-beam { position: absolute; top: -12%; width: 56%; height: 125%; pointer-events: none; transform-origin: 50% 0; mix-blend-mode: screen; filter: blur(5px);
  clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(210, 236, 255, .34), rgba(210, 236, 255, .06) 70%, transparent);
  animation: hm-lights 1.2s linear .15s backwards, hm-sweep-l 7s ease-in-out 1.3s infinite alternate; }
.hs-beam.l { left: -4%; rotate: -22deg; }
.hs-beam.r { right: -12%; rotate: 24deg; animation-name: hm-lights, hm-sweep-r; animation-duration: 1.2s, 8.5s; }
@keyframes hm-lights { 0% { opacity: 0; } 12% { opacity: .9; } 18% { opacity: .1; } 30%, 100% { opacity: 1; } }
@keyframes hm-sweep-l { from { rotate: -22deg; } to { rotate: 8deg; } }
@keyframes hm-sweep-r { from { rotate: 24deg; } to { rotate: -6deg; } }

.hs-name { position: absolute; left: 50%; top: 9%; margin: 0; white-space: nowrap; pointer-events: none; font: 900 clamp(84px, 12vw, 172px)/1 var(--font);
  letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1.5px rgba(238, 243, 255, .16);
  transform: translateX(calc(-50% + var(--mx) * 26px)); transition: transform 1s var(--ease-out); animation: hm-name .9s var(--ease-out) backwards; }
@keyframes hm-name { from { opacity: 0; letter-spacing: .25em; } }

.hs-floor { position: absolute; left: 50%; top: 79%; width: 82%; aspect-ratio: 1; transform: translate(-50%, -50%) rotateX(76deg);
  animation: hm-floor 1.2s var(--spring-soft) .25s backwards; }
@keyframes hm-floor { from { opacity: 0; transform: translate(-50%, -50%) rotateX(76deg) scale(.25); } }
.hs-floor i { position: absolute; inset: 0; border-radius: 50%; }
.hs-floor i:nth-child(1) { border: 2px solid color-mix(in srgb, var(--tint) 70%, transparent); box-shadow: 0 0 80px color-mix(in srgb, var(--tint) 35%, transparent), inset 0 0 50px color-mix(in srgb, var(--tint) 25%, transparent); }
.hs-floor i:nth-child(2) { inset: 9%; border: 3px dashed rgba(238, 243, 255, .2); animation: hm-spin 26s linear infinite; }
.hs-floor i:nth-child(3) { inset: 26%; background: radial-gradient(closest-side, color-mix(in srgb, var(--tint) 55%, transparent), transparent); }
@keyframes hm-spin { to { transform: rotate(360deg); } }

.hs-mon { position: absolute; left: 50%; bottom: 17%; width: min(74%, 430px); aspect-ratio: 1;
  transform: translate(calc(-50% - var(--mx) * 16px), calc(var(--my) * -10px)); transition: transform .9s var(--ease-out); }
.hs-bob { width: 100%; height: 100%; animation: hm-bob 5s ease-in-out infinite; }
@keyframes hm-bob { 50% { transform: translateY(-14px); } }
.hs-art { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 34px 26px rgba(3, 6, 18, .65)); animation: hm-send 1s var(--spring) backwards; }
/* the Pokéball send-out: a white flash that settles into the Pokémon */
@keyframes hm-send { 0% { opacity: 0; transform: translateY(40px) scale(.55); filter: brightness(4) saturate(0) blur(6px); }
  45% { opacity: 1; filter: brightness(2.2) saturate(.4) blur(1px); } }
.hs-flash { position: absolute; left: 50%; top: 58%; width: 70%; aspect-ratio: 1; margin: -35% 0 0 -35%; border-radius: 50%; border: 3px solid #fff;
  opacity: 0; pointer-events: none; animation: hm-burst .75s var(--ease-out); }
@keyframes hm-burst { from { opacity: 1; transform: scale(.15); border-width: 10px; } to { opacity: 0; transform: scale(1.5); border-width: 1px; } }

.hs-read { position: absolute; left: 0; bottom: 30px; display: grid; gap: 6px; justify-items: start; }
.hs-no { font-size: 13px; color: var(--ink-3); }
.hs-read b { font: 800 30px/1 var(--font); letter-spacing: -.02em; animation: hm-wipe .6s var(--ease-out) backwards; }
@keyframes hm-wipe { from { clip-path: inset(0 100% 0 0); transform: translateX(-10px); } to { clip-path: inset(0 0 0 0); } }
.hs-types { display: flex; gap: 6px; }
.hs-pips { position: absolute; right: 30px; bottom: 34px; display: flex; align-items: center; gap: 2px; }
.hs-pip { border: 0; background: none; padding: 10px 3px; cursor: pointer; }
.hs-pip i { position: relative; display: block; overflow: hidden; width: 14px; height: 5px; border-radius: var(--pill); background: var(--s3); transition: width var(--spring-t) var(--spring), background-color var(--t-fast); }
.hs-pip:hover i { background: var(--line-2); }
.hs-pip.on i { width: 40px; }
.hs-pip.on i::after { content: ""; position: absolute; inset: 0; background: var(--acc); transform-origin: left; animation: hm-fill var(--hold) linear; }
.hs.held .hs-pip.on i::after { animation: none; }
@keyframes hm-fill { from { transform: scaleX(0); } }

/* ---------- the move band ---------- */
.hm-band { overflow: clip; margin: 6px 0; padding: 14px 0; background: var(--acc); color: var(--acc-ink); rotate: -1.6deg; }
.hm-band-t { display: flex; align-items: center; gap: 26px; width: max-content; animation: hm-marq 46s linear infinite; }
.hm-band span { font: 900 32px/1 var(--font); letter-spacing: -.02em; white-space: nowrap; }
.hm-band i { width: 11px; height: 11px; background: var(--acc-ink); rotate: 45deg; }
.hm-band:hover .hm-band-t { animation-play-state: paused; }
@keyframes hm-marq { to { transform: translateX(-50%); } }

/* ---------- modes: one big row each; the accent sweeps in under the one you point at ---------- */
.hm-modes { display: grid; grid-template-columns: minmax(0, 1fr); border-radius: var(--r); overflow: clip; background: var(--s1); box-shadow: var(--ring); }
.hm-row { position: relative; isolation: isolate; overflow: clip; display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: center; gap: 22px;
  min-height: 112px; padding: 20px 30px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; transition: color .35s var(--ease-out); }
.hm-row + .hm-row { box-shadow: inset 0 1px 0 var(--line); }
.hm-row::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--acc); clip-path: inset(0 100% 0 0); transition: clip-path .55s var(--ease-out); }
.hm-row:hover, .hm-row:focus-visible { color: var(--acc-ink); }
.hm-row:hover::before, .hm-row:focus-visible::before { clip-path: inset(0 0 0 0); }
.hm-row:focus-visible { outline-offset: -4px; }
.hm-row > svg:first-child { width: 28px; height: 28px; color: var(--ink-3); transition: color .35s, transform var(--spring-t) var(--spring); }
.hm-row:hover > svg:first-child { color: var(--acc-ink); transform: rotate(-12deg) scale(1.15); }
.hm-row-t { position: relative; z-index: 1; display: grid; gap: 4px; justify-items: start; }
.hm-row-t b { font: 900 clamp(34px, 4.4vw, 58px)/1 var(--font); letter-spacing: -.04em; transition: transform var(--spring-t) var(--spring); }
.hm-row:hover .hm-row-t b { transform: translateX(10px); }
.hm-row-t span { font-size: 15px; color: var(--ink-2); transition: color .35s, transform var(--spring-t) var(--spring) .03s; }
.hm-row:hover .hm-row-t span { color: #0b3a4a; transform: translateX(10px); }
.hm-row-art { position: absolute; right: 96px; top: 50%; height: 150px; width: 150px; object-fit: contain; pointer-events: none; opacity: .3; filter: grayscale(1);
  transform: translateY(-50%) rotate(8deg) scale(.7); transition: transform .7s var(--spring), opacity .3s, filter .4s; }
.hm-row:hover .hm-row-art { opacity: 1; filter: grayscale(0) drop-shadow(0 14px 14px rgba(3, 20, 28, .35)); transform: translateY(-50%) rotate(-6deg) scale(1.25); }
.hm-row-go { width: 30px; height: 30px; rotate: -45deg; transition: rotate var(--spring-t) var(--spring), translate var(--spring-t) var(--spring); }
.hm-row:hover .hm-row-go { rotate: 0deg; translate: 4px 0; }

/* ---------- your corner: your six, your Gauntlet run ---------- */
.hm-corner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; }
.hm-card { display: grid; align-content: space-between; gap: 22px; padding: 26px; border-radius: var(--r); background: var(--s1); box-shadow: var(--ring); min-width: 0; }
.hm-card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hm-card h2 { font: 800 24px/1.15 var(--font); letter-spacing: -.02em; overflow-wrap: anywhere; }
.hm-chip { flex: none; border: 0; cursor: pointer; padding: 10px 18px; border-radius: var(--pill); background: var(--s3); color: var(--ink); font: 700 14px/1 var(--font); transition: background-color var(--t-fast), color var(--t-fast); }
.hm-chip:hover { background: var(--acc); color: var(--acc-ink); }
.hm-note { color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
/* six Pokéball slots; the team hops out of them one by one */
.hm-six { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.hm-slot { position: relative; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 30%, var(--s3), var(--s2) 70%); box-shadow: var(--ring); }
.hm-slot::before { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: var(--line); }
.hm-slot::after { content: ""; position: absolute; left: 38%; top: 38%; width: 24%; height: 24%; border-radius: 50%; background: var(--s1); box-shadow: 0 0 0 2px var(--line); }
.hm-slot img { position: absolute; z-index: 1; left: -18%; bottom: 6%; width: 136%; height: 136%; object-fit: contain;
  filter: drop-shadow(0 8px 6px rgba(3, 6, 18, .5)); animation: hm-bob 3.6s ease-in-out calc(var(--i) * -.55s) infinite; }
.live .hm-card:not(.in) .hm-slot img { opacity: 0; }
.live .hm-card.in .hm-slot img { animation: hm-hop .8s var(--spring) calc(.25s + var(--i) * 90ms) backwards, hm-bob 3.6s ease-in-out calc(var(--i) * -.55s) infinite; }
@keyframes hm-hop { from { opacity: 0; transform: translateY(30%) scale(.2); filter: brightness(4); } }
/* the Gauntlet ladder draws itself up to where you are */
.hm-ladder { width: 100%; height: auto; overflow: visible; }
.hm-ladder polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.hm-ladder .base { stroke: var(--line-2); stroke-width: 3; stroke-dasharray: 2 9; }
.hm-ladder .lit { stroke: var(--acc); stroke-width: 5; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1.5s var(--ease-out) .35s; }
.live .hm-card:not(.in) .lit { stroke-dashoffset: 1; }
.hm-ladder circle { fill: var(--s3); stroke: var(--s1); stroke-width: 4; transform-box: fill-box; transform-origin: center; }
.hm-ladder circle.b { fill: var(--ink); }
.hm-ladder circle.n { fill: var(--acc); stroke: var(--acc); stroke-opacity: .5; animation: hm-ping 1.8s var(--ease-out) infinite; }
@keyframes hm-ping { from { stroke-width: 0; stroke-opacity: .7; } to { stroke-width: 22; stroke-opacity: 0; } }
.live .hm-card.in .hm-ladder circle { animation: hm-dot .6s var(--spring) calc(.2s + var(--i) * 70ms) backwards; }
.live .hm-card.in .hm-ladder circle.n { animation: hm-dot .6s var(--spring) calc(.2s + var(--i) * 70ms) backwards, hm-ping 1.8s var(--ease-out) 1.4s infinite; }
@keyframes hm-dot { from { transform: scale(0); } }
.hm-mini { display: flex; flex-wrap: wrap; gap: 4px; }
.hm-mini img { width: 48px; height: 48px; object-fit: contain; transition: transform var(--spring-t) var(--spring); }
.hm-mini img:hover { transform: translateY(-6px) scale(1.15); }

/* ---------- sign-off: the name fills in as it scrolls into view ---------- */
.hm-sign { margin: 18px 0 0; text-align: center; user-select: none; white-space: nowrap; font: 900 clamp(80px, 15vw, 210px)/.9 var(--font); letter-spacing: -.03em;
  color: transparent; background: linear-gradient(var(--acc), var(--acc)) no-repeat 0 0 / 100% 100%, linear-gradient(var(--s2), var(--s2));
  -webkit-background-clip: text; background-clip: text; }
.live .hm-sign { background-size: 0% 100%, auto; transition: background-size 1.8s var(--ease-out) .2s; }
.live .hm-sign.in { background-size: 100% 100%, auto; }

/* ---------- scroll reveal (only once JS has said motion is fine: .live) ---------- */
.live .hm-rv:not(.hm-sign) { --d: calc(var(--i, 0) * 70ms); opacity: 0; translate: 0 44px;
  transition: opacity .7s var(--ease-out) var(--d), translate .9s var(--spring-soft) var(--d), color .35s var(--ease-out); }
.live .hm-rv.in { opacity: 1; translate: 0 0; }

@media (max-width: 980px) {
  .hm-hero { grid-template-columns: 1fr; }
  .hm-copy { padding: 40px 28px 0; }
  .hs { min-height: 460px; }
  .hs-beam { top: -60%; height: 165%; }
  .hs-read { left: 24px; }
  .hm-corner { grid-template-columns: 1fr; }
  .hm-row-art { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .home *, .home *::before, .home *::after, .hm-hero::before, .hm-hero::after { animation: none !important; transition: none !important; }
}

/* Play online */
.ol { display: grid; gap: 16px; }
.ol-start { display: grid; gap: 16px; max-width: 880px; }
.ol-start .field input { width: 100%; max-width: 340px; box-sizing: border-box; }
.ol-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .ol-choices { grid-template-columns: 1fr; } }
.ol-choices .pl-card { position: relative; overflow: hidden; align-content: start; padding: 20px 22px; box-shadow: var(--ring), var(--shadow); }
.ol-choices .pl-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(56, 214, 255, .14), transparent 70%); }
.ol-choices .pl-card + .pl-card::after { background: radial-gradient(circle, rgba(56, 214, 255, .14), transparent 70%); }
.ol-choices .btn { justify-self: start; }
.ol-code-in { font: 700 26px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; max-width: 280px;
  padding: 14px 12px 14px 20px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line-2); color: var(--acc); }
.ol-code-in::placeholder { font: 600 15px/1 var(--font); letter-spacing: .02em; text-transform: none; color: var(--ink-3); }

/* Room */
.ol-bar { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px 14px; border-radius: var(--r); background: var(--s1); box-shadow: var(--ring), var(--shadow); }
.ol-bar::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--acc); }
.ol-code { display: flex; align-items: center; gap: 12px; }
.ol-code b { font: 800 28px/1 var(--mono); letter-spacing: .2em; color: var(--acc); padding: 6px 10px 6px 16px; border-radius: var(--r); background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-2); }
.ol-people { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; }
.ol-people li { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: var(--pill); background: var(--s2); box-shadow: var(--ring); font-size: 14px; font-weight: 700; max-width: 260px; }
.ol-role { flex: none; font: 800 12px/1 var(--font); padding: 5px 9px 4px; border-radius: var(--pill); background: var(--line-2); color: var(--ink); }
.ol-p1 .ol-role, .ol-p2 .ol-role { background: var(--acc); color: var(--acc-ink); }
.ol-you { font-size: 13px; color: var(--ink-2); }
.ol-lobby { display: grid; gap: 16px; }
.ol-status { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.ol-status.ok { color: var(--acc); }

/* Battle */
.ol-battle { display: grid; gap: 14px; }
.ol-battle-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.ol-battle-h h2 { margin: 0; font: 800 26px/1.1 var(--font); letter-spacing: -.02em; }
.ol-battle-h .btn { margin-left: auto; }
.ol-scene { max-width: 760px; }
.ol-ctl { display: grid; gap: 12px; padding: 16px 18px; border-radius: var(--r); background: var(--s1); box-shadow: var(--ring), var(--shadow); max-width: 760px; }
.ol-ctl h3 { margin: 2px 0 0; display: flex; align-items: center; gap: 9px; font: 800 17px/1.1 var(--font); }
.ol-ctl h3::before { content: ""; flex: none; width: 6px; height: 16px; border-radius: var(--pill); background: var(--acc); }
.ol-moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ol-move { --tc: var(--acc); display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; }
.btn.ol-move { border-radius: var(--r); min-height: 64px; padding: 10px 14px 10px 18px; color: var(--ink); font-weight: 700;
  box-shadow: inset 6px 0 0 var(--tc), inset 0 0 0 1px color-mix(in srgb, var(--tc) 45%, var(--line));
  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 22%, var(--s2)), var(--s2) 70%); }
.btn.ol-move:hover:not(:disabled) { box-shadow: inset 6px 0 0 var(--tc), inset 0 0 0 1px color-mix(in srgb, var(--tc) 70%, var(--line));
  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 22%, var(--s2)), color-mix(in srgb, var(--tc) 10%, var(--s2)) 70%); }
.ol-z .btn.ol-move { box-shadow: inset 6px 0 0 var(--acc), inset 0 0 0 2px var(--acc); }
.ol-gims { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.ol-gim { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 6px; border-radius: var(--pill); background: var(--s2); box-shadow: inset 0 0 0 2px var(--line-2);
  font: 800 15px/1 var(--font); cursor: pointer; }
.ol-gim:has(input:checked) { background: var(--acc); color: var(--acc-ink); box-shadow: 0 0 16px rgba(56, 214, 255, .3); }
.ol-gim input { accent-color: var(--acc-ink); margin: 0; }
.ol-mons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
@media (max-width: 520px) { .ol-mons, .ol-moves { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ol-mon { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 14px 4px 4px; border: 0; border-radius: var(--pill); background: var(--s2);
  box-shadow: var(--ring), 0 2px 0 var(--btn-shadow); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; }
.ol-mon .spr { flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 72%); }
.ol-mon:hover { box-shadow: inset 0 0 0 1px var(--ink-3), 0 2px 0 var(--btn-shadow); }
.ol-mon.on { box-shadow: inset 0 0 0 2px var(--acc), 0 0 16px rgba(56, 214, 255, .25); }
.ol-tipwrap > .ol-mon { width: 100%; }
.ol-mon > span:not(.spr) { min-width: 0; line-height: 1.15; overflow-wrap: anywhere; }
.ol-mon small { white-space: nowrap; }
.ol-num { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); font: 800 12px/1 var(--mono); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.ol-slot { margin: 0; color: var(--ink-2); }
.ol-wait { margin: 0; padding: 14px 18px; border: 2px dashed var(--line-2); border-radius: var(--r); color: var(--ink-2); font-weight: 700; max-width: 760px; }
.ol-end { display: grid; gap: 10px; justify-items: start; max-width: 760px; padding: 18px 20px; border-radius: var(--r); background: var(--s2);
  box-shadow: inset 0 4px 0 var(--acc), var(--shadow), var(--ring); }
.ol-end p { margin: 0; }
.ol-end p b { font: 800 32px/1 var(--font); }

/* Draft */
.dr { display: grid; gap: 16px; }
.dr-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.dr-h h2 { margin: 0; font: 800 26px/1.1 var(--font); letter-spacing: -.02em; }
.dr-step { margin: 0; padding: 7px 14px 6px; border-radius: var(--pill); background: var(--acc); color: var(--acc-ink); font: 800 16px/1 var(--font); }
.dr-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.dr-mon { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr auto auto 1fr; align-items: center; column-gap: 8px;
  min-width: 0; padding: 4px 14px 4px 4px; border: 0; border-radius: var(--pill); background: var(--s2); box-shadow: var(--ring), 0 2px 0 var(--btn-shadow);
  color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; line-height: 1.15; cursor: pointer; text-align: left; }
.dr-mon .spr { grid-row: 1 / -1; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 72%); }
.dr-mon > span:not(.spr) { grid-row: 2; grid-column: 2; overflow-wrap: anywhere; }
.dr-mon small { grid-row: 3; grid-column: 2; }
.dr-mon:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--ink-3), 0 2px 0 var(--btn-shadow); }
.dr-mon:disabled { cursor: default; }
.dr-mon small { font-size: 11px; font-weight: 800; color: var(--ink-2); }
.dr-mon.sel { box-shadow: inset 0 0 0 2px var(--acc), 0 0 18px rgba(56, 214, 255, .3); }
.dr-mon.banned { opacity: .4; text-decoration: line-through; }
.dr-mon.dr-p1 { box-shadow: inset 0 0 0 2px var(--win-2); background: color-mix(in srgb, var(--win-2) 18%, var(--s2)); }

.dr-mon.dr-p1 small, .dr-mon.dr-p2 small { color: var(--ink); }
.dr-team.dr-p1 { box-shadow: inset 0 4px 0 var(--win-2), var(--ring); }
.dr-team.dr-p2 { box-shadow: inset 0 4px 0 var(--loss-2), var(--ring); }
.dr-pickbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r); background: var(--s1); box-shadow: var(--ring); }
.dr-pickbar .hint { flex-basis: 100%; margin: 0; }
.dr-order { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.dr-order li { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font: 800 12px/1 var(--mono); color: #fff; opacity: .55; }
.dr-order .dr-o-p1 { background: var(--win-2); color: var(--acc-ink); }
.dr-order .dr-o-p2 { background: var(--loss-2); color: var(--acc-ink); }
.dr-order .now { opacity: 1; background: var(--acc); color: var(--acc-ink); outline: 2px solid var(--acc); outline-offset: 2px; }
.dr-order .done { opacity: .25; }
.dr-rps-b { min-width: 96px; }
.dr-builds { display: grid; gap: 12px; }
.dr-bt { display: flex; align-items: center; gap: 6px; }
.dr-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.dr-opt { display: grid; gap: 3px; text-align: left; padding: 10px 14px; border: 0; border-radius: var(--r); background: var(--s2); box-shadow: var(--ring); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
.dr-opt:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.dr-opt.on { box-shadow: inset 0 0 0 2px var(--acc); }
.dr-src { justify-self: start; font: 800 12px/1 var(--font); padding: 3px 8px 2px; border-radius: var(--pill); background: var(--acc); color: var(--acc-ink); }

/* Auction */

/* Online battle: log, teams, hints (like Battle the AI) */

.ol-side h3::before { content: ""; flex: none; width: 5px; height: 14px; border-radius: var(--pill); background: var(--acc); }
.ol-log { max-height: 320px; overflow: auto; font-size: 13px; }

.ol-move { flex-direction: column; align-items: stretch; gap: 4px; }

.ol-mon-d { border-top: 1px solid var(--line); padding: 4px 0; }
