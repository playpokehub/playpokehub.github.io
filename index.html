.ol-mon-d summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; border-radius: var(--pill); padding: 1px 6px 1px 1px; }
.ol-mon-d summary:hover { background: var(--s2); }
.ol-mon-d summary::-webkit-details-marker { display: none; }
.ol-mon-d .spr-sm { width: 30px; height: 30px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 72%); }
.ol-mon-d.fnt { opacity: .45; }
.ol-mon-d.act .ol-mon-n { color: var(--acc); }
.ol-mon-n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-mon-d p { margin: 2px 0 2px 38px; }
.ol-movelist { margin: 0 0 4px 38px; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 12px; color: var(--ink-2); }
.ol-hp { flex: none; width: 60px; height: 7px; border-radius: var(--pill); background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.ol-hp span { display: block; height: 100%; border-radius: var(--pill); }
.ol-st { font: 800 10px/1 var(--mono); padding: 3px 5px; border-radius: var(--pill); background: var(--loss-1); color: var(--ink); }
.ol-scene { max-width: none; }
.ol-ctl, .ol-wait, .ol-end { max-width: none; }
.ol-lead { flex: none; margin-left: auto; font: 800 11px/1 var(--font); padding: 3px 8px 2px; border-radius: var(--pill); background: var(--acc); color: var(--acc-ink); }
.ol-scene { position: relative; }
.ol-scene-bad { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 20px; text-align: center; background: color-mix(in srgb, var(--s1) 92%, transparent); border-radius: var(--r); }
.ol-scene-fix { margin: -6px 0 0; }
.linkish { background: none; border: 0; padding: 0; color: var(--acc); font: inherit; text-decoration: underline; cursor: pointer; }
.linkish:hover { color: var(--acc); }
.ol-wait { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ol-away { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; } .ol-away p { margin: 0; }
.ol-tipwrap { display: block; min-width: 0; }
.ol-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ol-battle .pl-tip .pl-tip-res { display: grid; gap: 2px; }
.ol-field { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ol-tipwrap-i { display: inline-block; }
.ol-fchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: var(--pill); background: var(--s2); box-shadow: var(--ring); font-size: 13px; font-weight: 700; cursor: help; }

.ol-fchip .spr-sm { width: 28px; height: 28px; }
.ol-fvs { color: var(--ink-3); font: 800 13px/1 var(--font); }
.ol-bst { font-size: 11px; font-weight: 800; }
.ol-bst.up, .ol-now.up, .ol-stg.up, .ol-os.good { color: var(--hp); }
.ol-bst.down, .ol-now.down, .ol-stg.down, .ol-os.bad { color: var(--low); }

.ol-live { border-collapse: collapse; font-size: 13px; }
.ol-live th { text-align: left; font-weight: 700; color: var(--ink-2); padding: 1px 12px 1px 0; }
.ol-live td { padding: 1px 10px 1px 0; font-variant-numeric: tabular-nums; }
.ol-now { font-weight: 800; }
.ol-takes { display: flex; flex-wrap: wrap; gap: 4px 10px; }

/* Emotes (Clash Royale style): a cartoon king pops in on the sender's side, acts out his line, then floats away */
.em-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.em-pop { position: absolute; display: grid; justify-items: center; gap: 2px; transform-origin: 50% 100%;
  animation: em-pop 2.6s cubic-bezier(.2, .9, .3, 1) forwards; }
.em-near { left: calc(5% + var(--j)); bottom: 5%; }
.em-far { right: calc(5% + var(--j)); top: 4%; }
.em-crowd { left: calc(36% + var(--j)); bottom: 5%; }
.em-king { display: block; overflow: visible; filter: drop-shadow(0 4px 0 rgba(21, 23, 28, .9)) drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); }
.em-pop .em-laugh { animation: em-hehe .16s ease-in-out 3 alternate .35s, em-hehe .16s ease-in-out 3 alternate 1s; }
.em-pop .em-angry { animation: em-grr .07s linear 10 alternate .3s; }
.em-pop .em-smug { transform-origin: 50% 90%; animation: em-smug .5s ease-in-out 2 alternate .3s; }
.em-pop .em-tear { animation: em-tear .5s ease-out 3 .3s; }
.em-pop .em-tear-r { animation-name: em-tear-r; }
.em-pop .em-steam { transform-origin: 50% 30%; animation: em-steam .35s ease-in-out 4 alternate .3s; }
.em-text { font: 900 15px/1.1 system-ui, -apple-system, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .02em;
  color: #fff; white-space: nowrap; text-shadow: -2px -2px 0 #15171c, 2px -2px 0 #15171c, -2px 2px 0 #15171c, 2px 2px 0 #15171c,
  0 -2px 0 #15171c, 0 2px 0 #15171c, -2px 0 0 #15171c, 2px 0 0 #15171c, 0 4px 0 #15171c; }
.em-name { padding: 1px 8px; border-radius: 999px; background: rgba(21, 23, 28, .85); color: #fff; font-size: 11px; font-weight: 700;
  max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes em-pop {
  0% { opacity: 0; transform: translateY(24px) scale(.2); }
  12% { opacity: 1; transform: translateY(0) scale(1.2); }
  20% { transform: scale(.94); }
  28% { transform: scale(1.03); }
  36% { transform: scale(1); }
  84% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-30px); }
}
@keyframes em-hehe { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-6px) rotate(2deg); } }
@keyframes em-grr { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
@keyframes em-smug { from { transform: rotate(-8deg); } to { transform: rotate(6deg); } }
@keyframes em-tear { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(-9px, 10px); opacity: 0; } }
@keyframes em-tear-r { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(9px, 10px); opacity: 0; } }
@keyframes em-steam { from { transform: scale(.8); opacity: .6; } to { transform: scale(1.15) translateY(-3px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .em-pop { animation: em-fade 2.6s linear forwards; }
  .em-pop .em-king, .em-pop .em-tear, .em-pop .em-steam { animation: none; }
  @keyframes em-fade { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
}
.em-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.em-bar { display: flex; gap: 10px; }
.em-btn { width: 56px; height: 56px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 50% 35%, var(--line-2), var(--s2) 70%); box-shadow: inset 0 0 0 2px var(--line-2), inset 0 -4px 0 rgba(0, 0, 0, .25), 0 4px 0 var(--btn-shadow), 0 8px 16px rgba(0, 0, 0, .35);
  cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.em-btn .em-king { filter: none; }
.em-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.06); box-shadow: inset 0 0 0 2px var(--acc), inset 0 -4px 0 rgba(0, 0, 0, .25), 0 6px 0 var(--btn-shadow), 0 0 18px rgba(56, 214, 255, .3); }
.em-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--acc), inset 0 -2px 0 rgba(0, 0, 0, .25), 0 1px 0 var(--btn-shadow); }
.em-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.em-btn:disabled { opacity: .45; cursor: default; }

/* Four-player rooms: seat list, player 3 and 4 colours, and the tournament bracket */
.ol-p3 .ol-role, .ol-p4 .ol-role { background: var(--acc); color: var(--acc-ink); }
.ol-seats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ol-seat4 { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: var(--r); background: var(--s1); box-shadow: var(--ring); min-width: 0; }
.ol-seat4 b { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-seat4.ok .ol-status { color: var(--acc); }
@media (max-width: 560px) { .ol-seats { grid-template-columns: 1fr; } }
.pl-grid.dr-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .pl-grid.dr-four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .pl-grid.dr-four { grid-template-columns: 1fr; } }
.dr-mon.dr-p3 { box-shadow: inset 0 0 0 2px #f2b53c; background: color-mix(in srgb, #f2b53c 18%, var(--s2)); }
.dr-mon.dr-p4 { box-shadow: inset 0 0 0 2px #b98cff; background: color-mix(in srgb, #b98cff 18%, var(--s2)); }
.dr-mon.dr-p3 small, .dr-mon.dr-p4 small { color: var(--ink); }
.dr-team.dr-p3 { box-shadow: inset 0 4px 0 #f2b53c, var(--ring); }
.dr-team.dr-p4 { box-shadow: inset 0 4px 0 #b98cff, var(--ring); }
.dr-order .dr-o-p3 { background: #f2b53c; color: var(--acc-ink); }
.dr-order .dr-o-p4 { background: #b98cff; color: var(--acc-ink); }

.tb { display: grid; gap: 8px; margin-bottom: 12px; }
.tb-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 8px; }
.tb-m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 12px; border-radius: var(--r); background: var(--s1); box-shadow: var(--ring); min-width: 0; }
.tb-m.is-live .tb-t::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; background: var(--loss-2); vertical-align: 2px; }
.tb-m.is-watching { box-shadow: inset 0 0 0 2px var(--acc); }
.tb-t { flex-basis: 100%; font: 800 12px/1 var(--font); color: var(--ink-2); }
.tb-vs { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.tb-vs i { font-style: normal; color: var(--ink-3); font-size: 12px; margin: 0 2px; }
.tb-vs .won { color: var(--acc); }
.tb-vs .out { color: var(--ink-3); text-decoration: line-through; }
.tb-watch { min-height: 32px; padding: 0 12px; font-size: 13px; }
.tb-note { font-size: 12px; font-weight: 800; color: var(--acc); }
.tb-champ, .ol-champ { margin: 0; font: 800 20px/1.2 var(--font); color: var(--acc); }
@media (max-width: 760px) { .tb-list { grid-template-columns: 1fr; } }
.ol-coach { margin: 0 0 4px; text-align: right; }

/* ---------- you vs AI: formats and doubles (play.js, play-doubles.js) ---------- */
.pl-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pl-presets .chip-btn { font-weight: 800; color: var(--ink-2); background: var(--s2); padding: 5px 12px; }
.pl-presets .chip-btn.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.pl-rule-toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin-top: 6px; }
@media (max-width: 520px) { .pl-rule-toggles { grid-template-columns: 1fr; } }

/* doubles field (simple view) */
.pl-duo { display: grid; gap: 10px; }
.pl-duo .pl-mon { width: 100%; }
.pl-duo-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pl-duo-mon { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; min-width: 0; min-height: 96px;
  background: var(--s2); box-shadow: var(--ring); border-radius: var(--r); padding: 9px 12px; }

  .pl-duo-row { grid-template-columns: 1fr; }

}

/* doubles controls */
.pl-duo-controls { gap: 12px; }
.pl-duo-picked { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pl-duo-picked li { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px;
  background: var(--s2); box-shadow: inset 4px 0 0 var(--win-2), var(--ring); border-radius: var(--r); padding: 5px 8px 5px 14px; font-size: 14px; font-weight: 800; }
.pl-duo-picked li span { min-width: 0; overflow-wrap: anywhere; }
.pl-duo-slot { display: grid; gap: 10px; min-width: 0; }
.pl-duo-slot > h3.pl-sub { font: 800 15px/1.2 var(--font); color: var(--ink); text-transform: none; letter-spacing: 0; }
.pl-duo-mv { display: grid; gap: 3px; min-width: 0; }
.pl-duo-mv .pl-move { width: 100%; }
.pl-duo-hits { font-size: 11px; color: var(--ink-3); padding-left: 4px; }
.pl-targets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pl-target { appearance: none; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "img name" "img hint"; gap: 2px 8px;
  align-items: center; text-align: left; padding: 10px 12px 10px 15px; color: var(--ink); border: 0; box-shadow: var(--ring); border-radius: var(--r); background: var(--s2); cursor: pointer; min-height: 64px; }
.pl-target.side-2 { box-shadow: inset 4px 0 0 var(--loss-2), var(--ring); }
.pl-target.side-1 { box-shadow: inset 4px 0 0 var(--win-2), var(--ring); }

.pl-target .pl-mv-hint { grid-area: hint; }
@media (max-width: 520px) { .pl-targets { grid-template-columns: 1fr; } }

/* ---------- you vs AI (play.js) ---------- */
.pl-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.pl-aiteam { display: grid; gap: 6px; margin-top: 10px; min-width: 0; }
.pl-aiteam p { overflow-wrap: anywhere; }
.pl-start { justify-self: start; display: inline-flex; align-items: center; gap: 12px; font-size: 21px; padding: 13px 32px 13px 26px; }
.pl-start::before { content: ""; flex: none; border-left: 12px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }

/* battle layout */
.pl { display: grid; gap: 16px; }
.pl-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; }
.pl-head .eyebrow { margin-bottom: 6px; }
.pl-head h2 { font: 800 clamp(24px, 3vw, 32px)/1.1 var(--font); letter-spacing: -.02em; }
.pl-you-name { color: var(--win-3); }
.pl-foe-name { color: var(--loss-3); }
.pl-vs { color: var(--ink-3); font: 700 .7em var(--font); margin: 0 4px; }
.pl-head-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.pl-turn { font: 800 16px/1 var(--font); background: var(--s2); box-shadow: var(--ring); border-radius: var(--pill); padding: 8px 14px; }
.pl-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 18px; align-items: start; }
.pl-stage { display: grid; gap: 12px; min-width: 0; }
.pl-logbox { position: sticky; top: 20px; }
.log.pl-log { max-height: calc(100vh - 110px); min-height: 200px; }
.lg.new:not(.lg-gimmick) { background: color-mix(in srgb, var(--acc) 9%, transparent); }
@media (max-width: 880px) {
  .pl-main { grid-template-columns: 1fr; }
  .pl-logbox { position: static; }
  .log.pl-log { max-height: 340px; min-height: 0; }
}

/* Pokémon cards: blue stripe = you, red stripe = them */
.pl-mon { --side: var(--line-2); background: var(--s1); border-radius: var(--r); padding: 14px 16px 14px 20px; display: grid; gap: 8px; box-shadow: inset 5px 0 0 var(--side), var(--shadow), var(--ring); width: min(100%, 580px); min-width: 0; }
.pl-mon.side-1 { --side: var(--win-2); justify-self: start; }
.pl-mon.side-2 { --side: var(--loss-2); justify-self: end; }
.pl-who { display: flex; justify-content: space-between; gap: 10px; font: 800 13px/1.1 var(--font); color: var(--ink-3); }
.pl-mon.side-1 .pl-who b { color: var(--win-3); }
.pl-mon.side-2 .pl-who b { color: var(--loss-3); }
.pl-mon-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.pl-mon-h h3 { font: 800 21px/1.15 var(--font); letter-spacing: -.01em; }
.pl-nick-sp { font: 600 12px/1 var(--font); color: var(--ink-3); letter-spacing: 0; }
.pl-types, .pl-badges { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.pl-badges .gim { font-size: 11px; padding: 4px 6px 3px; }
.pl-hprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.pl-hp { display: block; height: 12px; background: var(--s3); box-shadow: var(--ring); border-radius: var(--pill); overflow: hidden; }
.pl-hp i { display: block; height: 100%; border-radius: 3px 0 0 3px; transition: width .5s ease; }
.pl-hp.side-1 i { background: var(--win-2); }
.pl-hp.side-2 i { background: var(--loss-2); }
.pl-hp.low i { background-image: repeating-linear-gradient(-45deg, transparent 0 4px, rgba(255, 255, 255, .35) 4px 7px); }
.pl-hp.mini { height: 6px; box-shadow: none; }
@media (prefers-reduced-motion: reduce) { .pl-hp i { transition: none; } }
.pl-hpnum { font: 600 15px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; min-width: 4ch; }
.pl-hpnum .muted { font-size: 12px; }
.pl-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pl-status { text-transform: none; }
.pl-boost { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: var(--pill); background: var(--s2); box-shadow: var(--ring); }
.pl-boost.up { color: var(--win-3); }
.pl-boost.down { color: var(--loss-3); }
.pl-detail { font-size: 13px; color: var(--ink-2); }
.pl-slots { list-style: none; margin: 2px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.pl-slot { display: grid; gap: 4px; align-content: center; min-width: 0; min-height: 34px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--pill); background: var(--s2); font-size: 11px; }
.pl-slot-n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-slot.unknown { place-items: center; border-style: dashed; background: transparent; color: var(--ink-3); font: 800 14px/1 var(--font); }
.pl-slot.active { border-color: var(--loss-2); box-shadow: inset 0 0 0 1px var(--loss-2); }
.pl-slot.fainted { opacity: .55; }
.pl-slot.fainted .pl-slot-n { text-decoration: line-through; }
@media (max-width: 520px) { .pl-slots { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* field line */
.pl-field { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 12px; }
.pl-fchip { background: var(--s2); box-shadow: var(--ring); border-radius: var(--pill); padding: 3px 12px; font-weight: 800; }
.pl-fchip.side-1 { box-shadow: inset 4px 0 0 var(--win-2), var(--ring); }
.pl-fchip.side-2 { box-shadow: inset 4px 0 0 var(--loss-2), var(--ring); }

/* last-turn recap (phones only: the log sits far below there) */
.pl-recap { display: none; }
@media (max-width: 880px) {
  .pl-recap { display: grid; gap: 4px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .pl-recap h3 { font: 700 12px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pl-recap ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
}

/* controls */
.pl-controls { background: var(--s1); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; box-shadow: var(--ring); min-width: 0; }
.pl-controls h3 { font: 800 16px/1.2 var(--font); }
.pl-sub { font: 800 14px/1 var(--font); color: var(--ink-3); margin-top: 2px; }
.pl-forced { box-shadow: inset 0 0 0 2px var(--acc), var(--shadow); background: color-mix(in srgb, var(--acc) 7%, var(--s1)); }
.pl-forced h3 { font-size: 18px; }
.pl-gims { display: grid; gap: 6px; }
.pl-gim { appearance: none; display: inline-flex; align-items: center; gap: 8px; font: 800 15px/1 var(--font); padding: 8px 14px 7px; border-radius: var(--pill); border: 2px solid var(--line-2); background: var(--s2); color: var(--ink); cursor: pointer; }
.pl-gim::before { content: ""; width: 10px; height: 10px; flex: none; border: 2px solid currentColor; border-radius: 50%; }
.pl-gim.on::before { background: currentColor; }
.pl-gim:hover:not(:disabled) { border-color: var(--ink-3); }
.pl-gim:disabled { opacity: .5; cursor: not-allowed; }
.pl-gim .gem { width: 9px; height: 9px; background: var(--tc); transform: rotate(45deg); display: inline-block; }
.pl-gim.on.g-mega { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.pl-gim.on.g-ultra { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.pl-gim.on.g-z { border: 4px double var(--acc); padding: 6px 12px 5px; background: var(--s2); }
.pl-gim.on.g-dynamax { background: #c4214f; border-color: #8e1236; color: #fff; }
.pl-gim.on.g-tera { border-color: var(--tera); background: var(--tera); color: #1b1300; }
.pl-act { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(220px, 1fr); gap: 12px 20px; align-items: start; }
.pl-act-col { display: grid; gap: 10px; min-width: 0; }
.pl-act-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
@media (max-width: 1180px) { .pl-act { grid-template-columns: 1fr; } }
.pl-moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pl-move { appearance: none; display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; grid-template-areas: "type name name" "type meta pp" "type hint hint";
  gap: 2px 10px; align-items: center; text-align: left; min-height: 60px; padding: 6px 16px 6px 6px; border-radius: var(--pill); cursor: pointer; color: var(--ink);
  border: 0; background: var(--s2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 45%, var(--line));
  transition: transform var(--spring-t) var(--spring), box-shadow var(--t-fast), background-color var(--t-fast); }
.pl-move:hover:not(:disabled) { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--tc); background: color-mix(in srgb, var(--tc) 10%, var(--s2)); }
.pl-move:active:not(:disabled) { transform: scale(.97); transition: transform var(--t-fast) var(--spring); }
.pl-mv-type { grid-area: type; align-self: stretch; display: grid; place-items: center; min-height: 44px; padding: 0 6px; border-radius: var(--pill);
  background: var(--tc); color: var(--tt, #fff); font: 800 13px/1 var(--font); text-align: center; overflow-wrap: anywhere; }
.pl-move:disabled { opacity: .45; cursor: not-allowed; }
.pl-mv-name { grid-area: name; font: 800 17px/1.15 var(--font); letter-spacing: -.01em; overflow-wrap: break-word; min-width: 0; }
.pl-move.alt .pl-mv-name { color: var(--acc); }
.pl-mv-pp { grid-area: pp; justify-self: end; font: 700 13px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pl-mv-meta { grid-area: meta; font-size: 13px; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.pl-mv-hint { grid-area: hint; justify-self: start; font: 700 12px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); padding: 3px 9px; border-radius: var(--pill); background: var(--s3); text-align: right; }
.pl-mv-hint.ko { color: #04140b; background: var(--hp); }
.pl-mv-hint.maybe { color: var(--hp); }
.pl-mv-pp.out { color: var(--loss-3); }
.pl-mv-hint.imm { color: var(--ink-2); font-weight: 600; }
.pl-mv-meta .muted { color: var(--ink-2); }
.pl-bench-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.pl-bench { appearance: none; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ring n" "ring meta"; align-items: center; gap: 0 8px;
  text-align: left; padding: 4px 8px 4px 4px; color: var(--ink); border: 0; border-radius: var(--pill); background: var(--s2); cursor: pointer; transition: transform var(--spring-t) var(--spring), background-color var(--t-fast); }
.pl-bench:hover:not(:disabled), .pl-bench:focus-visible { transform: translateY(-2px); background: var(--s3); }
.pl-ring { grid-area: ring; display: grid; place-items: center; width: 40px; height: 40px; padding: 3px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--s3) 0); }
.pl-ring > .spr.spr-sm { width: 100%; height: 100%; } /* beats sprite.css .spr-sm, which loads later */
.pl-ring > * { width: 100%; height: 100%; border-radius: 50%; background: var(--s2); display: grid; place-items: center; overflow: hidden; }
.pl-bench:disabled { opacity: .5; cursor: not-allowed; }
.pl-bench-n { grid-area: n; align-self: end; font-weight: 800; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; max-width: 100%; }
.pl-bench.fainted { opacity: .45; }
.pl-bench.fainted .pl-bench-n { text-decoration: line-through; }
.pl-bench-meta { grid-area: meta; align-self: start; font-size: 12px; color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }

/* end of battle */
.pl-end { display: grid; gap: 8px; border-radius: var(--r); padding: 18px 20px; background: var(--s2); box-shadow: var(--shadow), var(--ring); }
.pl-end.win { background: var(--acc); color: var(--acc-ink); box-shadow: none; }
.pl-end.win .hint, .pl-end.win .muted { color: #0b3a4a; }
.pl-end.loss { box-shadow: inset 5px 0 0 var(--loss-2), var(--shadow), var(--ring); }
.pl-end-t { font: 900 clamp(30px, 4vw, 40px)/1 var(--font); letter-spacing: -.02em; }
.pl-end.win .pl-end-t { color: var(--acc-ink); }
.pl-end.loss .pl-end-t { color: var(--loss-3); }

/* animated battle scene (Pokémon Showdown's renderer in an iframe, scene.js) */
.pl-scene { width: 100%; max-width: 640px; aspect-ratio: 640 / 360; border-radius: var(--r); overflow: hidden; background: var(--s2); box-shadow: var(--ring); }
.pl-scene iframe { display: block; width: 100%; height: 100%; border: 0; }
.pl-watch .actions { justify-content: flex-start; }

/* switch hover card (Showdown-style tooltip on the bench buttons) */
.pl-bench-wrap { display: block; }
.pl-bench-wrap:has(.pl-bench:disabled) { cursor: not-allowed; }
.pl-bench:disabled { pointer-events: none; }
.pl-tip { position: fixed; z-index: 30; display: grid; gap: 6px; padding: 14px 16px; background: var(--s3); color: var(--ink);
  border-radius: var(--r); box-shadow: var(--shadow), inset 0 0 0 1px #34406a; font-size: 13px; line-height: 1.35; pointer-events: none;
  transition: opacity var(--t-fast), translate var(--spring-t) var(--spring), scale var(--spring-t) var(--spring); }
@starting-style { .pl-tip:not([hidden]) { opacity: 0; translate: 0 8px; scale: .94; } }
.pl-tip[hidden] { display: none; }
.pl-tip.above { transform: translateY(-100%); }
.pl-tip-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pl-tip-h b { font-size: 15px; }
.pl-tip-line .muted { margin-right: 3px; }
.pl-tip-k { margin-top: 3px; font: 800 12px/1.2 var(--font); color: var(--ink-3); }
.pl-tip-moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.pl-tip-moves li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 5px 8px; border-left: 4px solid var(--tc);
  border-radius: 12px; background: color-mix(in srgb, var(--tc) 12%, var(--s2)); }
.pl-tip-mv { display: flex; align-items: center; font-weight: 700; min-width: 0; }
.pl-tip-pp { font-size: 11px; color: var(--ink-2); align-self: center; }
.pl-tip-meta { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
.pl-tip-res { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 12px; font-weight: 700; }
.pl-eff.eff-super { color: var(--win-3); }
.pl-eff.eff-weak { color: var(--loss-3); }
.pl-eff.eff-none { color: var(--ink-3); }
.pl-eff.eff-neutral { color: var(--ink-2); font-weight: 600; }
.pl-tip-dmg { color: var(--ink); font-variant-numeric: tabular-nums; }
.pl-tip-vs { font-weight: 800; color: var(--ink-2); min-width: 7.5em; }
/* their attacks on the benched Pokémon: red = it's weak, blue = it resists */
.pl-tip-thr { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pl-tip-thr li { display: grid; gap: 3px; }
.pl-tip-atk { display: flex; flex-wrap: wrap; gap: 4px; }
.pl-def { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--s2); border: 1px solid var(--line); }
.pl-def em { font-style: normal; }
.pl-def small { flex-basis: 100%; font-size: 11px; font-weight: 600; color: var(--ink-2); }
.pl-def.def-weak { border-color: var(--loss-2); }
.pl-def.def-weak em { color: var(--loss-3); }
.pl-def.def-resist, .pl-def.def-immune { border-color: var(--win-2); }
.pl-def.def-resist em, .pl-def.def-immune em { color: var(--win-3); }

/* hint + autopilot */
.pl-assist { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.pl-assist .toggle { flex: 1 1 220px; }
.pl-advice { display: grid; gap: 6px; padding: 12px 16px; box-shadow: inset 0 0 0 2px var(--acc); border-radius: var(--r);
  background: color-mix(in srgb, var(--acc) 8%, var(--s1)); }
.pl-advice-k { font: 800 13px/1 var(--font); color: var(--ink-3); }
.pl-advice-t { font: 800 18px/1.25 var(--font); }
.pl-advice-r { font-size: 14px; color: var(--ink-2); }
.pl-move.rec { box-shadow: inset 0 0 0 3px var(--acc); }
.pl-bench.rec { box-shadow: inset 0 0 0 3px var(--acc); }

/* music & sounds (volume sliders) */
.pl-sound-pop { display: grid; gap: 10px; max-width: 520px; margin-left: auto; padding: 16px 18px; background: var(--s1);
  border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); }
.pl-sound-pop h3 { font: 800 17px/1.2 var(--font); }
.pl-sound-pop .actions { justify-content: flex-end; }
.pl-sound { display: grid; gap: 8px; }
.pl-picture { display: grid; gap: 6px; }
.pl-picture-t { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.pl-vol { position: relative; display: grid; cursor: pointer; }
.pl-vol-t { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 1;
  font: 800 14px/1 var(--font); color: var(--ink); text-shadow: 0 1px 2px var(--bg); }
.pl-vol input[type="range"] { appearance: none; -webkit-appearance: none; width: 100%; height: 38px; margin: 0; padding: 0; cursor: pointer;
  background: var(--s2); border: 2px solid var(--line-2); border-radius: var(--pill); overflow: hidden; }
.pl-vol.master input[type="range"] { border-color: var(--ink-3); }
.pl-vol input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 34px;
  background: var(--acc); border: 2px solid var(--acc-ink); border-radius: var(--pill); }
.pl-vol input[type="range"]::-moz-range-thumb { width: 10px; height: 30px; background: var(--acc); border: 2px solid var(--acc); border-radius: 2px; }
.pl-vol input[type="range"]::-moz-range-track { background: transparent; }
.pl-vol input[type="range"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pl-sound-d > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 2px 0; }
.pl-sound-d[open] { display: grid; gap: 8px; }

/* autopilot panel: fixed size so the page doesn't jump as turns play out */
.pl-auto { gap: 6px; }
.pl-auto-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
.pl-auto-status { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; color: var(--ink-2); }
.pl-auto-status > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-auto-move { font-size: 15px; line-height: 1.4; height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-auto-why { --lines: 3; font-size: 14px; line-height: 1.45; color: var(--ink-2); height: calc(var(--lines) * 1.45em);
  display: -webkit-box; -webkit-line-clamp: var(--lines); -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 720px) { .pl-auto-why { --lines: 4; } }
@media (max-width: 480px) { .pl-auto-why { --lines: 6; } }
.pl-turn { min-width: 9ch; text-align: center; font-variant-numeric: tabular-nums; }
.pl-tags { min-height: 22px; }
.pl-field { min-height: 26px; align-content: center; }
.pl-mon-h { min-height: 30px; }
@media (max-width: 880px) { .pl-recap ul { height: calc(8 * 1.5em); overflow: auto; } }

/* Battle the AI setup: one card with a 2 × 2 grid instead of a long sidebar */
.pl-setup { display: grid; gap: 16px; }
.pl-setup-h .lede { margin: 4px 0 0; }
.pl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 760px) { .pl-grid { grid-template-columns: 1fr; } }
.pl-card { display: grid; gap: 10px; min-width: 0; padding: 16px 18px; border-radius: var(--r); background: color-mix(in srgb, var(--s2) 60%, var(--s1)); box-shadow: var(--ring); }
/* card title with a cyan tick */
.pl-card-t { margin: 0; display: flex; align-items: center; gap: 9px; font: 800 18px/1.1 var(--font); color: var(--ink); }
.pl-card-t::before { content: ""; flex: none; width: 6px; height: 18px; border-radius: var(--pill); background: var(--acc); }
.pl-card-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pl-card select, .pl-card textarea { width: 100%; box-sizing: border-box; }
.seg-sm { flex-wrap: nowrap; }
.seg-sm button { padding: 5px 10px; font-size: 12px; }
.pl-mons { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pl-mons li { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 10px 3px 3px; border-radius: var(--pill); background: var(--s1); box-shadow: var(--ring); font-size: 13px; font-weight: 800; }
.pl-mons li > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-mons li i { font-style: normal; font-weight: 500; color: var(--ink-3); }
.pl-mons .spr-sm { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 50% 55%, var(--s3) 0 62%, transparent 63%); }
@media (max-width: 420px) { .pl-mons { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pl-levels button { font-size: 12px; padding: 6px 8px; }
.pl-opts { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.pl-card .hint { margin: 0; }
.pl-go { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pl-how { border-top: 1px solid var(--line); padding-top: 12px; }
.pl-how summary { cursor: pointer; font-weight: 800; color: var(--ink-2); }
.pl-how .steps { margin: 10px 0 0; }

/* AI strength: Elo slider (strength.js BANDS) with the four named levels as quick picks */
.pl-elo input[type=range] { width: 100%; accent-color: var(--acc); margin: 4px 0 0; }
.pl-elo-v { margin: 2px 0 0; display: flex; align-items: baseline; gap: 8px; color: var(--ink-3); }
.pl-elo-v b { font: 800 30px/1 var(--font); letter-spacing: -.02em; color: var(--ink); }
.pl-elo-band { font: 800 17px/1 var(--font); color: var(--acc); }
.pl-elo + .hint + .pl-levels { margin-top: 8px; }

/* Replays (src/ui/replay.js) */
.rp .rp-scene { margin-top: 12px; }
.rp-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.rp-turn { margin-left: auto; color: var(--ink-2); }
@media (max-width: 520px) { .rp-turn { margin-left: 0; width: 100%; } }

/* ---------- motion and polish ----------
   Loads after the other src/ui/*.css files (alphabetical), so it can refine them. Rules:
   only transform / opacity move (60 fps), nothing here delays a battle turn, and everything turns off under
   prefers-reduced-motion (bottom of this file). Colours come from the tokens in index.html. */

/* utilities for the redesign: press squash and hover lift, both on the spring easing */
.press, .lift { transition: transform var(--spring-t) var(--spring); }
.lift:hover { transform: translateY(-3px); transition: transform var(--spring-t) var(--spring); }
.press:active { transform: scale(.96); transition: transform var(--t-fast) var(--spring); }

@keyframes pk-enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes pk-fade { from { opacity: 0; } }
@keyframes pk-pop { from { opacity: 0; transform: scale(.94); } }
@keyframes pk-grow-x { from { transform: scaleX(0); } }
@keyframes pk-pulse { 50% { opacity: .35; } }
@keyframes pk-sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* screens: every tab, and each step inside one (setup → battle → result, spin → edit → ladder…), eases in.
   `backwards` so nothing is left transformed afterwards (fixed hover cards inside stay where they belong). */
.wrap > *,
.pl-setup, .pl, .rp, .gt-intro, .gt-slots, .gt-edit, .gt-ladder, .ol-start, .ol-lobby, .ol-battle, .dr, .bd {
  animation: pk-enter var(--t-slow) var(--ease-out) backwards;
}
/* results arriving: cards come in one after another */
.grid > .card, .gt-list > li, .dr-pool > .dr-mon { animation: pk-enter var(--t-slow) var(--ease-out) backwards; }
.grid > .card:nth-child(2):nth-child(2), .gt-list > li:nth-child(2) { animation-delay: 40ms; }
.grid > .card:nth-child(3):nth-child(3), .gt-list > li:nth-child(3) { animation-delay: 80ms; }
.grid > .card:nth-child(4):nth-child(4), .gt-list > li:nth-child(4) { animation-delay: 120ms; }
.grid > .card:nth-child(5):nth-child(5), .gt-list > li:nth-child(5) { animation-delay: 160ms; }
.grid > .card:nth-child(n+6), .gt-list > li:nth-child(n+6) { animation-delay: 200ms; }
.dr-pool > .dr-mon { animation-duration: var(--t-med); }

.engine::before { transition: background-color var(--t-med); }
.engine:not(.ok):not(.bad)::before { animation: pk-pulse 1s ease-in-out infinite; }
.engine { animation: pk-fade var(--t-med) backwards; }

/* ---------- buttons and other things you press ---------- */
.btn { transition: border-color var(--t-fast), background-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast) var(--ease-out), filter var(--t-fast), opacity var(--t-med); }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: inset 0 0 0 1px var(--line-2), 0 3px 0 var(--btn-shadow); }
.btn-primary:hover:not(:disabled) { box-shadow: 0 8px 22px rgba(56, 214, 255, .45), inset 0 -3px 0 rgba(0, 0, 0, .18); }
.btn-ghost:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--ink-3); }
.btn-danger:hover:not(:disabled) { box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(1px); transition-duration: 40ms; }
.seg button, .chip-btn, .chip button, .linkish { transition: background-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast); }
.seg button:active:not(.on) { transform: translateY(1px); }
@keyframes pk-squish { from { transform: scale(.92); } }
.seg button.on { animation: pk-squish var(--t-med) var(--spring); }

/* cards you pick: lift a little on hover, press down on click */
.pl-move, .pl-bench, .pl-gim, .pl-target, .dr-mon, .dr-opt, .ol-mon, .pl-mons li {
  transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast), border-color var(--t-fast), background-color var(--t-fast), color var(--t-fast), opacity var(--t-med);
}
.pl-move:hover:not(:disabled), .pl-bench:hover:not(:disabled), .pl-target:hover:not(:disabled), .dr-mon:hover:not(:disabled), .dr-opt:hover, .ol-mon:hover {
  transform: translateY(-1px);
}
.pl-move:active:not(:disabled), .pl-bench:active:not(:disabled), .pl-target:active:not(:disabled), .dr-mon:active:not(:disabled), .dr-opt:active, .ol-mon:active, .pl-gim:active:not(:disabled) {
  transform: translateY(1px); transition-duration: 40ms;
}

/* toggles: the knob eases across */
.tg { transition: background-color var(--t-med) var(--ease-out); }
.tg::after { transition: transform var(--t-med) var(--spring); }
.toggle:active .tg::after { transform: scaleX(1.2); }
.toggle:active input:checked + .tg::after { transform: translateX(14px) scaleX(1.2); }

/* focus rings grow in instead of snapping (the ring itself is the one in index.html) */
:focus-visible { transition: outline-offset var(--t-fast) var(--ease-out); }
input[type="text"], input:not([type]), select, textarea { transition: border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast); }
input[type="text"]:focus, input:not([type]):focus, select:focus, textarea:focus { border-color: var(--focus); background-color: var(--s1); }

/* ---------- loading ---------- */
/* status lines ("AI is thinking…", "Starting the battle engine…"): fade in, with a slim bar sweeping underneath */
.progress { position: relative; overflow: hidden; animation: pk-fade var(--t-med) var(--ease-out) backwards; }
.progress::after { content: ""; position: absolute; left: 0; bottom: 0; width: 40%; height: 2px; background: var(--acc);
  animation: pk-sweep 1.4s var(--ease-out) infinite; }
.boot { display: flex; align-items: center; gap: 12px; }
.boot::before { content: ""; width: 16px; height: 16px; flex: none; border: 3px solid var(--line-2); border-top-color: var(--acc);
  border-radius: 3px; animation: spin .8s steps(8) infinite; }
[aria-busy="true"] .intro h2 { animation: pk-pulse 1.6s ease-in-out infinite; }
.pl-auto-status .spinner { animation-duration: .8s; }

/* sprites fade in once they have loaded instead of popping in (sprite.js marks them data-in) */
.spr img { transition: opacity var(--t-med) var(--ease-out); }
.spr img:not([data-in]) { opacity: 0; }

/* pop-ups and folding sections */
.pl-sound-pop { animation: pk-pop var(--t-med) var(--ease-out); transform-origin: top right; }
details[open] > :not(summary) { animation: pk-fade var(--t-med) var(--ease-out); }
summary { transition: color var(--t-fast); }
summary:hover { color: var(--ink); }
.warn, .note, .ol-err { animation: pk-fade var(--t-med) var(--ease-out) backwards; }

/* ---------- bars ---------- */
/* HP bars (play.js HpBar): the fill slides, the trail behind it shows the damage just taken, then catches up */
.pl-hp { position: relative; }
.pl-hp i, .pl-hp-trail { position: absolute; inset: 0; width: auto; height: auto; border-radius: 0; transform-origin: left center; }
.pl-hp i { transition: transform .45s var(--ease-out), background-color var(--t-med); }
.pl-hp-trail { display: block; background: color-mix(in srgb, var(--acc) 70%, var(--s1)); transition: transform .5s var(--ease-out) .35s; }
@keyframes pk-throb { to { opacity: .6; } }
.pl-hp.low i { animation: pk-throb .6s ease-in-out infinite alternate; }
.ol-hp span { width: 100%; transform-origin: left center; transition: transform .45s var(--ease-out), background-color var(--t-med); }
/* stat bars and win-rate bars grow in when they appear */
.stat-bar i, .wb-fill { transform-origin: left center; animation: pk-grow-x .6s var(--ease-out) backwards; }
.stat:nth-child(2) .stat-bar i { animation-delay: 30ms; } .stat:nth-child(3) .stat-bar i { animation-delay: 60ms; }
.stat:nth-child(4) .stat-bar i { animation-delay: 90ms; } .stat:nth-child(5) .stat-bar i { animation-delay: 120ms; }
.stat:nth-child(6) .stat-bar i { animation-delay: 150ms; }
.wb-pending { animation: pk-pulse 1.2s ease-in-out infinite; }
/* auction countdown: smooth, and red with a pulse in the last three seconds */
.au-timer span { width: 100%; transform-origin: left center; transition: transform .2s linear, background-color var(--t-med); }
.au-timer.low span { background: var(--loss-2); }
.au-timer.low + p { color: var(--loss-3); font-weight: 700; }
.au-timer.low span { animation: pk-throb .25s ease-in-out infinite alternate; }
.au-bid-n { display: inline-block; animation: pk-bump .35s var(--spring); }
@keyframes pk-bump { from { transform: scale(1.35); } }

/* ---------- battles ---------- */
/* this turn's new log lines slide in from the side stripe */
@keyframes pk-slide-in { from { opacity: 0; transform: translateX(-6px); } }
.lg.new { animation: pk-slide-in var(--t-med) var(--ease-out) backwards; }
.pl-controls, .pl-advice, .ol-ctl, .ol-wait { animation: pk-fade var(--t-med) var(--ease-out) backwards; }
.pl-forced { animation: pk-pop var(--t-med) var(--ease-out) backwards; }
.pl-gim.on { animation: pk-squish var(--t-med) var(--spring); }
.pl-slot { transition: opacity var(--t-slow), border-color var(--t-med), box-shadow var(--t-med); }
.pl-boost, .pl-status, .pl-badges .gim { animation: pk-pop var(--t-med) var(--spring) backwards; }
.pl-turn { transition: border-color var(--t-med); }
/* the end of a battle: the banner drops in, the title bounces, a win gets a shine across it */
.pl-end, .ol-end { position: relative; overflow: hidden; animation: pk-pop var(--t-slow) var(--spring) backwards; }
@keyframes pk-drop { from { opacity: 0; transform: translateY(-14px) scale(1.08); } }
.pl-end-t { animation: pk-drop .5s var(--spring) .1s backwards; }
.pl-end > :not(.pl-end-t) { animation: pk-fade var(--t-slow) var(--ease-out) .25s backwards; }
.pl-end.win::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .32), transparent);
  animation: pk-sweep 1.1s var(--ease-out) .35s both; }

/* replay: a slim bar under the controls shows how far through the battle you are */
.rp-prog { flex: 1 0 100%; order: 10; height: 4px; border-radius: 99px; background: var(--s2); overflow: hidden; }
.rp-prog i { display: block; height: 100%; background: var(--acc); transform-origin: left center; transition: transform var(--t-slow) var(--ease-out); }
.rp-turn { font-variant-numeric: tabular-nums; }

/* AI strength (Elo) slider: a filled track and a thumb that grows while you drag */
.pl-elo input[type=range] { appearance: none; -webkit-appearance: none; height: 26px; padding: 0; background: transparent; cursor: pointer; }
/* the filled part shows the S/V strength gradient (lime -> amber -> scarlet -> violet), the rest is dimmed */
.pl-elo input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px;
  background: linear-gradient(to right, transparent var(--p, 50%), rgba(14, 11, 26, .78) var(--p, 50%)), linear-gradient(90deg, var(--acc), #ffb938, var(--low), var(--acc)); }
.pl-elo input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin-top: -7px;
  border-radius: 50%; background: #fff; border: 4px solid var(--acc-ink); box-shadow: 0 0 0 2px #fff, 0 3px 8px rgba(0, 0, 0, .45);
  transition: transform var(--t-fast) var(--spring); }
.pl-elo input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.1); }
.pl-elo input[type=range]:active::-webkit-slider-thumb { transform: scale(1.25); }
.pl-elo input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: rgba(14, 11, 26, .78); }
.pl-elo input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--acc), #ffb938, var(--low)); }
.pl-elo input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid var(--acc-ink);
  transition: transform var(--t-fast) var(--spring); }
.pl-elo input[type=range]:active::-moz-range-thumb { transform: scale(1.25); }
.pl-elo-band { display: inline-block; animation: pk-fade var(--t-med) var(--ease-out); }

/* ---------- Gauntlet ---------- */
/* reels light up while they spin and settle with a small bounce when they stop */
.gt-reel { transition: border-color var(--t-med), box-shadow var(--t-med); }
.gt-reel.spin { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 35%, transparent); }
@keyframes pk-lock { 40% { transform: scale(1.05); } }
.gt-reel:not(.spin) { animation: pk-lock var(--t-slow) var(--ease-out); }
.gt-reel.spin b { opacity: .55; }
.gt-reel b { transition: opacity var(--t-med); }
/* ladder: the next trainer glows softly, beaten ones get a tick-mark pop */
.gt-list li { position: relative; transition: opacity var(--t-slow), border-color var(--t-med); }
.gt-list li.now::after { content: ""; position: absolute; inset: -1px; border-radius: var(--r); pointer-events: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 45%, transparent); animation: pk-throb .9s ease-in-out infinite alternate; }
.gt-ok { animation: pk-pop var(--t-slow) var(--spring) .2s backwards; }
.gt-intro .pl-card, .gt-modes .pl-card { transition: border-color var(--t-med), transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast); }
.gt-modes .pl-card:hover { transform: translateY(-2px); }

/* ---------- Draft and Auction ---------- */
/* a picked Pokémon flashes in its player's colour; the turn marker pulses; new team entries pop in */
@keyframes pk-pick { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
.dr-mon.dr-p1, .dr-mon.dr-p2 { animation: pk-pick var(--t-slow) var(--ease-out); }
.dr-mon.banned { transition: opacity var(--t-slow); }
.dr-mon.sel { animation: pk-squish var(--t-med) var(--spring); }
.dr-order li { transition: opacity var(--t-med); }
.dr-order .now { animation: pk-squish var(--t-slow) var(--spring); }
.dr-step { animation: pk-fade var(--t-med) var(--ease-out); }
.dr-team .pl-mons li, .ol-people li { animation: pk-pop var(--t-med) var(--spring) backwards; }
.au-lot { animation: pk-pop var(--t-slow) var(--ease-out) backwards; }
.au-n { animation: pk-fade var(--t-med) var(--ease-out) backwards; }

/* ---------- respect "reduce motion" ----------
   Movement is switched off; things still change instantly, and end events still fire. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important;
    transition-duration: .01ms !important; transition-delay: 0s !important; scroll-behavior: auto !important;
  }
  .btn:hover:not(:disabled), .pl-move:hover:not(:disabled), .pl-bench:hover:not(:disabled), .pl-target:hover:not(:disabled), .dr-mon:hover:not(:disabled), .dr-opt:hover, .ol-mon:hover, .gt-modes .pl-card:hover { transform: none; }
  .pl-end.win::after { display: none; }
  .progress::after { display: none; }
}

/* ---------- Pokémon sprites (sprite.js) ---------- */
.spr { flex: none; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.spr img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
.spr img.px { image-rendering: pixelated; min-width: 60%; }
.spr-lg { width: 132px; height: 120px; }
.spr-md { width: 72px; height: 72px; }
.spr-sm { width: 40px; height: 40px; }
.spr-none { visibility: hidden; }
@media (max-width: 520px) { .spr-lg { width: 96px; height: 96px; } .spr-md { width: 60px; height: 60px; } }

/* where sprites sit */
.card-h > .spr { margin: -4px 0 -4px -4px; border-radius: 50%; background: radial-gradient(circle at 50% 58%, var(--s3) 0 60%, transparent 61%); }
.card-title { flex: 1 1 auto; }
.gp-m-h > .spr { margin: -8px 0; }
.pl-mon-body { display: flex; align-items: flex-end; gap: 12px; min-width: 0; }
.pl-mon-info { flex: 1 1 auto; min-width: 0; display: grid; gap: 8px; }
.pl-foe .pl-mon-body > .spr { margin-left: auto; }
.pl-slot > .spr { width: 100%; height: 34px; }
.pl-slot:has(.spr) { align-content: end; justify-items: center; text-align: center; }
.pl-slot:has(.spr) .pl-slot-n { justify-self: stretch; }
.pl-slot.fainted > .spr img { filter: grayscale(1); }
.pl-bench.fainted .spr img { filter: grayscale(1); opacity: .6; }
@media (max-width: 520px) { .pl-mon-body { gap: 8px; } }

.boot { max-width: 1240px; margin: 80px auto; padding: 0 16px; font: 800 20px var(--font); color: var(--ink-2); }
</style>
