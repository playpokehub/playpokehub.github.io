<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build and battle-test Pokémon teams for Showdown's formats: OU, Ubers, VGC, National Dex, doubles and more.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%227%22%20fill%3D%22%23ffcb05%22%20stroke%3D%22%2315171c%22%20stroke-width%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M1%208h14%22%20stroke%3D%22%2315171c%22%20stroke-width%3D%221.5%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%222.2%22%20fill%3D%22%23fff%22%20stroke%3D%22%2315171c%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<title>PokéHub</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Barlow+Condensed:ital,wght@1,700;1,800&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  /* Scarlet/Violet, dark only (docs/superpowers/specs/2026-09-29-sv-redesign-design.md) */
  color-scheme: dark;
  --bg: #120e20;
  --surface: #1d1830;
  --surface-2: #282142;
  --line: #342b50;
  --line-2: #463b6b;
  --ink: #f2effa;
  --ink-2: #bdb6d8;
  --ink-3: #9a93b8;
  --scarlet: #ff6a48;
  --violet: #a36bff;
  --violet-ink: #b58aff;
  --lime: #d9ff3d;
  --lime-ink: #14101f;
  /* decorative gradient; buttons with white text use the deeper one (every stop >= 4.6:1 with white) */
  --grad: linear-gradient(100deg, #ff6a48 0%, #ff3d7a 45%, #a36bff 100%);
  --grad-btn: linear-gradient(100deg, #d63d1f 0%, #d12a64 50%, #7b3fe4 100%);
  --accent: #d9ff3d;
  --accent-ink: #14101f;
  --accent-deep: #b8e000;
  --focus: #d9ff3d;
  --brand-hub: #ffffff;
  --btn: #282142; --btn-hover: #332a55; --btn-line: #342b50; --btn-shadow: #0b0816; --danger-ink: #ff8a95;
  --win-3: #9ccbff; --win-2: #5aa9ff; --win-1: #1d3a66;
  --neutral: #3a3350;
  --loss-1: #5e2330; --loss-2: #ff5c6c; --loss-3: #ff9aa4;
  --on-strong: #14101f; --on-soft: #f2effa;
  --warn-bg: #3a2e0c; --warn-ink: #ffd98a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  --ring: inset 0 0 0 1px var(--line);
  --r: 14px; --r-lg: 22px; --pill: 999px;
  /* motion (polish.css): short, eased, and off when the player asks for reduced motion */
  --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-pop: cubic-bezier(.3, 1.5, .5, 1);
  --t-fast: .12s; --t-med: .22s; --t-slow: .4s;
  --display: "Rubik", system-ui, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 600 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(rgba(255, 255, 255, .045) 1.2px, transparent 1.3px) 0 0 / 14px 14px fixed, var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* ---------- side rail (src/ui/nav.js) ---------- */
.app { display: grid; grid-template-columns: 96px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 16px 0 14px; background: #0a0714; box-shadow: inset -1px 0 0 var(--line); overflow-y: auto; scrollbar-width: none; }
.rail-logo { display: grid; justify-items: center; gap: 7px; color: var(--ink); text-decoration: none; border-radius: 14px; padding: 4px; }
.rail-ball { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid #14101f; box-shadow: 0 0 0 2px rgba(255, 255, 255, .9);
  background: linear-gradient(180deg, var(--scarlet) 0 46%, #14101f 46% 54%, #fff 54%); }
.rail-ball::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #fff; border: 2.5px solid #14101f; }
.rail-name { font: 800 13px/1 var(--display); letter-spacing: -.01em; }
.rail-name b { color: #ff9a2e; }
.rail-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.rail-a { width: 76px; display: grid; justify-items: center; gap: 5px; padding: 10px 4px 8px; border-radius: 18px; color: var(--ink-3);
  text-decoration: none; font: 800 11px/1.1 var(--body); text-align: center; }
.rail-a svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rail-a:hover { color: var(--ink); background: var(--surface-2); }
.rail-a.on { background: var(--lime); color: var(--lime-ink); box-shadow: 0 0 18px rgba(217, 255, 61, .3); }
.engine { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.engine::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.engine.ok::before { background: #2bd46b; box-shadow: 0 0 0 3px rgba(43, 212, 107, .2); }
.engine.bad { color: var(--loss-2); }
.engine.bad::before { background: var(--loss-2); }
.rail-engine { margin: auto 0 0; flex-direction: column; text-align: center; font-size: 11px; line-height: 1.25; }

/* ---------- layout ---------- */
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 24px 28px 64px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { .split { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow), var(--ring); }
.controls { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; }
@media (max-width: 880px) { .controls { position: static; max-height: none; } }
.panel h2 { font: 800 26px/1.1 var(--display); letter-spacing: -.02em; }
.lede { color: var(--ink-2); font-size: 14px; }
.results { display: grid; gap: 18px; min-width: 0; }
.results-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.results-h h2, .intro h2 { font: 800 clamp(24px, 3vw, 32px)/1.1 var(--display); letter-spacing: -.02em; }
/* S/V slanted label: a parallelogram tag (the text itself stays upright) */
.eyebrow { display: block; width: fit-content; font: 800 italic 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: #fff;
  background: #d63d1f; padding: 5px 14px 4px; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); margin-bottom: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.box { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--ring); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.box h3 { font-size: 16px; }
.alt-h { font-size: 18px; margin-top: 8px; }

/* ---------- form ---------- */
.field { display: grid; gap: 6px; }
.field label, .flabel { font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="number"], input:not([type]), select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; }
input[type="text"]:focus, input[type="number"]:focus, input:not([type]):focus, select:focus, textarea:focus { border-color: var(--lime); outline: none; box-shadow: 0 0 0 3px rgba(217, 255, 61, .18); }
textarea { resize: vertical; font-size: 13px; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
.hint { font-size: 12px; color: var(--ink-3); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { appearance: none; border: 0; background: var(--btn); color: var(--ink); padding: 9px 16px; border-radius: var(--pill); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--ring), 0 2px 0 var(--btn-shadow); transition: box-shadow .12s, background .12s, filter .12s; }
.btn:hover:not(:disabled) { background: var(--btn-hover); box-shadow: inset 0 0 0 1px var(--line-2), 0 2px 0 var(--btn-shadow); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: var(--ring), 0 1px 0 var(--btn-shadow); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: progress; }
.btn-primary { background: var(--grad-btn); color: #fff; font: 800 italic 17px/1.1 var(--label); letter-spacing: .06em; text-transform: uppercase; padding: 10px 22px;
  box-shadow: 0 6px 18px rgba(209, 42, 100, .35), inset 0 -3px 0 rgba(0, 0, 0, .18); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--grad-btn); box-shadow: 0 8px 22px rgba(209, 42, 100, .45), inset 0 -3px 0 rgba(0, 0, 0, .18); }
.btn-primary:active:not(:disabled) { box-shadow: 0 3px 10px rgba(209, 42, 100, .35), inset 0 -2px 0 rgba(0, 0, 0, .18); }
.btn-ghost { background: transparent; color: var(--ink); padding: 7px 14px; box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-ghost:hover:not(:disabled) { background: var(--btn-hover); box-shadow: inset 0 0 0 1px var(--ink-3); }
.btn-ghost.on { box-shadow: inset 0 0 0 1px var(--lime); color: var(--ink); }
.btn-danger { background: transparent; color: var(--danger-ink); box-shadow: inset 0 0 0 1px rgba(255, 92, 108, .55); }
.btn-danger:hover:not(:disabled) { background: var(--loss-2); box-shadow: none; color: var(--on-strong); }
.btn-danger.armed { background: var(--loss-2); box-shadow: none; color: var(--on-strong); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-primary.btn-sm { font-size: 15px; padding: 6px 16px; }
.seg { display: flex; flex-wrap: wrap; background: var(--surface-2); border-radius: var(--pill); box-shadow: var(--ring); padding: 4px; gap: 4px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 7px 12px; border-radius: var(--pill); font-size: 13px; font-weight: 800; color: var(--ink-2); cursor: pointer; }
.seg button:hover:not(.on) { color: var(--ink); background: var(--btn-hover); }
.seg button.on { background: var(--lime); color: var(--lime-ink); box-shadow: 0 0 14px rgba(217, 255, 61, .25); }
.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.tg { flex: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line-2); position: relative; transition: background .15s; margin-top: 1px; }
.tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s, background .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.toggle input:checked + .tg { background: var(--lime); }
.toggle input:checked + .tg::after { background: var(--lime-ink); }
.toggle input:checked + .tg::after { transform: translateX(14px); }
.toggle input:focus-visible + .tg { outline: 2px solid var(--focus); outline-offset: 2px; }
.tg-l { display: block; font-weight: 600; font-size: 14px; }
.tg-h { display: block; font-size: 12px; color: var(--ink-3); }
.chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.chip-input:focus-within { border-color: var(--lime); box-shadow: 0 0 0 3px rgba(217, 255, 61, .18); }
.chip-input input:not([type]):focus, .chip-input input[type="text"]:focus { box-shadow: none; }
.chip-input input { flex: 1 1 120px; min-width: 0; width: auto; border: 0; background: transparent; padding: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--pill); padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 600; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); font-size: 16px; line-height: 1; padding: 0 4px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); border-radius: var(--pill); padding: 4px 11px; font-size: 12px; font-weight: 800; cursor: pointer; }
.chip-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.chip-btn.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
details.more > summary, details.sample > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 4px 0; }
details.more[open] { display: grid; gap: 12px; }
.move-locks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.progress { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r); box-shadow: var(--ring); padding: 9px 14px; }
.spinner { width: 14px; height: 14px; flex: none; border: 2px solid var(--line-2); border-top-color: var(--lime); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--r); padding: 9px 12px; font-size: 13px; }
.note { font-size: 12px; color: var(--ink-3); }

/* ---------- gimmick plan ---------- */
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; margin: 0; background: var(--surface); box-shadow: var(--ring); border-radius: var(--r-lg); overflow: hidden; }
.plan div { padding: 10px 14px; border-right: 1px solid var(--line); }
.plan div:last-child { border-right: 0; }
.plan dt { font: 800 italic 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
.plan dd { margin: 0; font: 800 15px/1.2 var(--display); }

/* ---------- set card ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow), var(--ring); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-title { min-width: 0; }
.card-title h3 { font: 800 19px/1.2 var(--display); letter-spacing: -.01em; }
.sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.lead-tag { display: inline-block; font: 800 italic 12px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; background: var(--lime); color: var(--lime-ink); padding: 3px 8px 2px; border-radius: var(--pill); margin-bottom: 5px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.abil { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tera-note { font-size: 12px; }
.type { display: inline-block; background: var(--tc); color: var(--tt); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; }
.type-sm { font-size: 11px; padding: 1px 6px; }
.tdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--tc); margin-right: 7px; flex: none; transform: translateY(0); }
.moves { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; font-weight: 500; }
.moves li { display: flex; align-items: center; min-width: 0; }
.spread { font-size: 12px; color: var(--ink-2); }
.stats { display: grid; gap: 3px; }
.stat { display: grid; grid-template-columns: 38px 1fr 36px 30px; gap: 8px; align-items: center; font-size: 12px; }
.stat-l { color: var(--ink-3); font-weight: 600; }
.stat-l em { font-style: normal; margin-left: 2px; }
.stat-l .up { color: var(--win-2); }
.stat-l .down { color: var(--loss-2); }
.stat-bar { height: 6px; background: #0e0b1a; border-radius: var(--pill); overflow: hidden; }
.stat-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--violet-ink)); border-radius: var(--pill); }
.stat-v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.stat-ev { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; }
.why { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--accent); padding-left: 10px; }
.handles { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; }
.handles .k, .calc .k { font: 800 italic 12px/1.2 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }
.h-chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--pill); padding: 1px 8px; }
.h-chip.rival { border-color: var(--ink-2); font-weight: 700; }
.card-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.set-paste { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.gim { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 800 italic 13px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px 4px; border-radius: var(--pill); border: 2px solid var(--line-2); white-space: nowrap; }
.gim-mega { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }
.gim-ultra { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-deep); }
.gim-z { background: var(--surface); color: var(--ink); border-color: var(--lime); border-style: double; border-width: 3px; }
.gim-dynamax { background: #c4214f; border-color: #8e1236; color: #fff; }
.gim-tera { background: var(--surface); color: var(--ink); border-color: var(--tc); }
.gim-tera .gem { width: 9px; height: 9px; background: var(--tc); transform: rotate(45deg); display: inline-block; }
.gim-primal { background: var(--surface-2); color: var(--ink-2); border-color: var(--line-2); }

/* ---------- win / loss encoding (diverging blue ↔ red) ---------- */
.pchip { display: inline-block; min-width: 44px; text-align: center; font: 600 12px/1 var(--mono); padding: 4px 6px; border-radius: 4px; }
.p-w3 { background: var(--win-3); color: var(--on-strong); }
.p-w2 { background: var(--win-2); color: var(--on-strong); }
.p-w1 { background: var(--win-1); color: var(--on-soft); }
.p-n { background: var(--neutral); color: var(--on-soft); }
.p-l1 { background: var(--loss-1); color: var(--on-soft); }
.p-l2 { background: var(--loss-2); color: var(--on-strong); }
.p-l3 { background: var(--loss-3); color: var(--on-strong); }
.threats, .mgrid, .kos, .calc { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.threats li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; font-size: 14px; }
.threats li .muted { grid-column: 2; font-size: 12px; }
.rv { font-style: normal; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.mgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 12px; font-size: 13px; max-height: 520px; overflow: auto; }
.mgrid li { display: flex; gap: 8px; align-items: center; }
.kos li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.winbars { display: grid; gap: 8px; }
.wb-axis { font-size: 11px; color: var(--ink-3); }
.wb-scale { position: relative; height: 14px; }
.wb-scale b { position: absolute; top: 0; font-weight: 400; }
.wb-scale b:nth-child(1) { left: 0; }
.wb-scale b:nth-child(2) { left: 50%; transform: translateX(-50%); }
.wb-scale b:nth-child(3) { right: 0; }
.wb { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.wb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb-track { position: relative; height: 14px; background: var(--surface-2); border-radius: var(--pill); overflow: hidden; }

/* ---------- counter ---------- */

.facts { display: grid; gap: 8px; background: var(--surface-2); border-radius: var(--r); padding: 10px; }
.fact-big { display: flex; gap: 10px; align-items: center; font-size: 13px; }

/* ---------- simulate ---------- */
.scoreboard { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: end; background: var(--surface); box-shadow: var(--shadow), var(--ring); border-radius: var(--r-lg); padding: 22px; }
.big { display: grid; }
.big-n { font: 800 clamp(48px, 8vw, 76px)/1 var(--display); letter-spacing: -.03em; }
.big-l { color: var(--ink-2); font-size: 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 24px; flex: 1; margin: 0; }
.kv dt { font: 800 italic 13px/1.2 var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.kv dd { margin: 0; font: 600 20px/1.2 var(--mono); }
.log { display: grid; gap: 8px; max-height: 560px; overflow: auto; padding-right: 4px; }
.log-turn h4 { font: 800 italic 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 6px 0 4px; position: sticky; top: 0; background: var(--surface); padding: 3px 0; }
.log ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lg { font-size: 13px; padding: 2px 8px; border-left: 3px solid transparent; }
.lg.side-1 { border-left-color: var(--win-2); }
.lg.side-2 { border-left-color: var(--loss-2); }
.lg-move { font-weight: 600; }
.lg-note, .lg-field, .lg-boost, .lg-heal { color: var(--ink-3); font-size: 12px; }
.lg-faint { font-weight: 700; }
.lg-gimmick { font-weight: 700; background: var(--surface-2); }
.lg-mon { color: inherit; text-decoration: underline dotted; text-underline-offset: 2px; text-decoration-color: var(--ink-3); }
.lg-mon:hover, .lg-mon:focus-visible { color: var(--accent-deep); text-decoration-style: solid; text-decoration-color: currentColor; }
.lg-win { font: 800 16px var(--display); padding: 8px; }

/* ---------- intro ---------- */
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: grid; gap: 12px; max-width: 760px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
.modebar { margin-bottom: 16px; max-width: 520px; }
.rules-set { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.rules-set legend { padding: 0; margin-bottom: 8px; }
/* Trainer account (src/ui/account.js): ball in the rail's bottom corner, hover card, trainer-card dialog */
.ac-corner { margin-top: auto; }
.ac-corner + .rail-engine { margin-top: 0; }
.ac-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 80px; height: 32px; padding: 0 7px 0 4px; border: 0;
  border-radius: 99px; cursor: pointer; color: var(--ink); background: var(--surface-2); box-shadow: var(--ring);
  transition: transform var(--t-fast, .12s) ease-out, background-color .15s; }
.ac-btn.out { padding: 0 8px; }
.ac-btn:hover { background: var(--surface); transform: scale(1.04); }
.ac-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.ac-btn .ac-ball { background: #f4f4f6; border-radius: 50%; }
.ac-btn.out .ac-ball { background: none; }
.ac-pts { font-size: 11px; font-weight: 800; white-space: nowrap; }
.ac-btn.out .ac-pts { font-family: var(--body); color: var(--ink-2); }

/* profile picture: the trainer sprite's head, cropped into a circle */
.ac-av { position: relative; display: inline-block; flex: none; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 30%, #33504c, #172624); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .18); }
.ac-av img { position: absolute; left: 50%; top: -10%; width: 290%; max-width: none; transform: translateX(-50%); image-rendering: pixelated; }
.ac-ball { display: block; color: #1e1b0c; flex: none; }
.ac-ball.off { color: var(--ink-3); }

.ac-tip { position: fixed; left: 104px; bottom: 16px; z-index: 30; width: 280px; max-width: calc(100vw - 116px); max-height: calc(100vh - 32px); overflow: auto; padding: 14px; display: grid; gap: 8px;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow), var(--ring);
  opacity: 0; visibility: hidden; transform: translateX(-4px); transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none; }
.ac-corner:hover .ac-tip, .ac-btn:focus-visible + .ac-tip { opacity: 1; visibility: visible; transform: none; }
/* the rail is its own stacking layer (z-index 5): lift it while the card is open so the card sits over the page */
.rail:has(.ac-corner:hover), .rail:has(.ac-btn:focus-visible) { z-index: 40; }
@media (hover: none) { .ac-tip { display: none; } }

.ac-ach { display: grid; gap: 8px; }
.ac-rank { display: flex; align-items: center; gap: 10px; }
.ac-rname { display: flex; align-items: center; gap: 5px; }
.ac-rname .ac-ball { background: #f4f4f6; border-radius: 50%; }
.ac-name { font: 800 16px/1.15 var(--display); overflow-wrap: anywhere; }
.ac-rname { font-size: 13px; color: var(--ink-2); }
.ac-bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.ac-bar i { display: block; height: 100%; background: var(--lime); border-radius: inherit; }
.ac-stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 2px 0 0; font-size: 13px; }
.ac-stats div { display: contents; }
.ac-stats dt { color: var(--ink-3); }
.ac-stats dd { margin: 0; text-align: right; }

.ac-dlg { width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0; border-radius: var(--r-lg);
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow), var(--ring); }
.ac-dlg::backdrop { background: rgba(4, 10, 9, .6); }
.ac-dlg-in { display: grid; gap: 14px; padding: 20px; }
.ac-dlg-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ac-dlg h2 { font: 800 22px/1.1 var(--display); }
.ac-dlg h3 { font-size: 15px; }
.ac-form { display: grid; gap: 12px; }

.ac-earned { font-size: 14px; }

.ac-up { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.ac-up .ac-ball { background: #f4f4f6; border-radius: 50%; }

.ac-avs { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.ac-av-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.ac-av-opt { position: relative; display: grid; justify-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: var(--r); cursor: pointer;
  background: var(--surface-2); box-shadow: var(--ring); }
.ac-av-opt:hover { background: var(--btn-hover, var(--surface-2)); }

.ac-av-opt input { position: absolute; opacity: 0; pointer-events: none; }
.ac-av-opt:has(input:focus-visible) { outline: 2px solid var(--lime); outline-offset: 2px; }
.ac-av-l { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.ac-change { justify-self: start; }
.ac-who { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Build: Showdown-style teambuilder (builder.js) ---------- */
.bd { display: grid; gap: 18px; }
.bd-top { gap: 12px; }
.bd-top-h { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }

/* team slots */

  padding: 8px 12px 8px 8px; border: 0; box-shadow: var(--ring); border-radius: var(--r); background: var(--surface); cursor: pointer; }

/* editor */
.bd-editor { gap: 16px; padding: 18px 20px; }

.bd-edit-name { flex: 1 1 220px; display: grid; gap: 6px; min-width: 0; }

@media (max-width: 520px) { .bd-moves { grid-template-columns: minmax(0, 1fr); } }
.bd-field input[aria-expanded="true"] { border-color: var(--lime); background: var(--surface); }
.bd-problems { margin: 0; padding: 8px 10px 8px 28px; display: grid; gap: 2px; }

/* chooser (the pick list) */
.bd-chooser { display: grid; gap: 6px; border-radius: var(--r-lg); background: var(--surface-2); box-shadow: var(--ring); padding: 12px; min-width: 0; }
.bd-chooser-t { font: 800 italic 15px/1.2 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.bd-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; max-height: 420px; overflow: auto; overscroll-behavior: contain; }
.bd-group { font: 800 italic 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 8px 4px 2px; }
.bd-row { appearance: none; width: 100%; display: grid; gap: 2px 10px; align-items: center; text-align: left; padding: 7px 10px; color: var(--ink);
  border: 0; border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 13px; min-width: 0; }
.bd-row:hover { background: var(--btn-hover); }

.bd-name { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.bd-tag { display: inline-block; margin-left: 6px; font: 800 10px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--violet-ink);
  border: 1px solid color-mix(in srgb, var(--violet) 50%, transparent); border-radius: var(--pill); padding: 2px 6px; vertical-align: 1px; }
.bd-desc { color: var(--ink-2); font-size: 12px; min-width: 0; }
.bd-num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.bd-head { font: 800 italic 12px/1.2 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 0 8px; }
.bd-head > * { min-width: 0; }

/* species rows */
.bd-row-sp { grid-template-columns: 40px minmax(90px, 1.3fr) minmax(90px, 1fr) minmax(0, 1.6fr) minmax(210px, 2fr); }
.bd-abil { font-size: 12px; color: var(--ink-2); }

.bd-bs, .bd-bs-h { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)) 1.2fr; gap: 2px; font: 12px/1.2 var(--mono); text-align: right; }

.bd-head.bd-row-sp { display: grid; gap: 2px 10px; }
@media (max-width: 760px) {
  .bd-row-sp { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .bd-row-sp .bd-abil, .bd-row-sp .bd-bs { grid-column: 2 / -1; }

}

/* move rows */
.bd-row-mv { grid-template-columns: minmax(110px, 1.6fr) 74px 70px 48px 64px 36px; }
.bd-row-mv .bd-desc { grid-column: 1 / -1; }
.bd-head.bd-row-mv { display: grid; gap: 2px 10px; padding: 0; }
.bd-sort { appearance: none; border: 1px solid transparent; background: transparent; border-radius: var(--pill); padding: 4px 8px; text-align: left;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }

.bd-sort:hover { border-color: var(--line-2); }

@media (max-width: 560px) {
  .bd-row-mv { grid-template-columns: minmax(0, 1fr) auto; }
  .bd-row-mv > span:nth-child(n+3):not(.bd-desc) { display: none; }

  .bd-head.bd-row-mv { grid-template-columns: repeat(3, auto); justify-content: start; }
}

/* item / ability rows */
.bd-row-it, .bd-row-ab { grid-template-columns: minmax(120px, 1fr) minmax(0, 2.4fr); }
@media (max-width: 560px) { .bd-row-it, .bd-row-ab { grid-template-columns: minmax(0, 1fr); } }

/* stats: nature, EV sliders, IVs */
.bd-stats { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.bd-stats-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 14px; margin-bottom: 4px; }
.bd-stats-top h3 { font: 800 italic 18px/1.2 var(--label); letter-spacing: .06em; text-transform: uppercase; margin-right: auto; align-self: center; }
.bd-f-nature { flex: 1 1 220px; max-width: 320px; }
.bd-stat { display: grid; grid-template-columns: 42px 34px minmax(40px, 1fr) 64px minmax(120px, 2fr) 52px 44px; gap: 8px; align-items: center; }
.bd-stat-h { font: 800 italic 12px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.bd-stat-h > span:nth-child(n+2) { text-align: right; }
.bd-stat-h > span:nth-child(3), .bd-stat-h > span:nth-child(5) { text-align: left; }
.bd-st-l { font-weight: 800; font-size: 13px; }

.bd-st-l.down { color: var(--loss-3); }
.bd-st-base, .bd-st-v { text-align: right; font-size: 13px; }
.bd-st-v { font-weight: 700; font-size: 14px; }
.bd-st-bar { height: 8px; background: #0e0b1a; border-radius: var(--pill); overflow: hidden; }

.bd-st-bar i.hi { background: var(--win-2); }
.bd-st-bar i.lo { background: var(--loss-2); }
.bd-stat input[type="number"] { padding: 5px 6px; text-align: right; font-family: var(--mono); font-size: 13px; }
.bd-ev-r { width: 100%; accent-color: var(--lime); margin: 0; }
.bd-left { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.bd-left.over { color: var(--loss-3); font-weight: 700; }
@media (max-width: 560px) {
  .bd-stat { grid-template-columns: 38px 30px minmax(0, 1fr) 58px 48px 40px; grid-template-areas: "l b bar ev iv v" "r r r r r r"; row-gap: 2px; }
  .bd-st-l { grid-area: l; } .bd-st-base { grid-area: b; } .bd-st-bar { grid-area: bar; } .bd-ev-n { grid-area: ev; }
  .bd-ev-r { grid-area: r; } .bd-iv-n { grid-area: iv; } .bd-st-v { grid-area: v; }
  .bd-stat-h { grid-template-areas: "l b bar ev iv v"; }
  .bd-stat-h > span:nth-child(5) { display: none; }
  .bd-stat-h > span:nth-child(1) { grid-area: l; } .bd-stat-h > span:nth-child(2) { grid-area: b; } .bd-stat-h > span:nth-child(3) { grid-area: bar; }
  .bd-stat-h > span:nth-child(4) { grid-area: ev; } .bd-stat-h > span:nth-child(6) { grid-area: iv; } .bd-stat-h > span:nth-child(7) { grid-area: v; }
}

/* Dex Draft */
.dd-intro, .dd-draft { display: grid; gap: 16px; }

  background: var(--surface-2); box-shadow: var(--ring); font: 800 12px/1.2 var(--display); text-align: center; overflow-wrap: anywhere; }

/* online: everyone's progress */
.dd-ol-prog { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.dd-ol-prog li { display: grid; gap: 2px; padding: 8px 12px; border-radius: var(--r); background: var(--surface-2); box-shadow: var(--ring); }
.dd-ol-prog li.me { box-shadow: inset 0 0 0 2px var(--lime); }
.dd-ol-prog b { font: 800 14px/1.2 var(--display); }
.dd-teamview .dd-ol-prog { margin-top: 12px; }

/* ---------- format picker (formats.js) ---------- */
.fmt-pick select { width: 100%; }
.fmt-facts { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fmt-facts li { font-size: 12px; font-weight: 800; color: var(--ink-2); background: var(--surface); box-shadow: var(--ring); border-radius: var(--pill); padding: 3px 10px; }
.fmt-gim { display: grid; gap: 8px; margin-top: 6px; }
.fmt-note { margin: 0; }

/* ---------- team preview (play.js) ---------- */
.tp { display: grid; gap: 14px; }
.tp-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.tp-h h3 { margin: 0; }
.tp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 720px) { .tp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .tp-grid { grid-template-columns: 1fr; } }
.tp-mon { appearance: none; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center;
  text-align: left; padding: 10px 12px; color: var(--ink); border: 0; box-shadow: var(--ring); border-radius: var(--r); background: var(--surface-2); min-height: 72px; cursor: pointer; }
.tp-mon:hover:not(:disabled) { background: var(--btn-hover); }
.tp-mon.on { box-shadow: inset 0 0 0 2px var(--lime); background: color-mix(in srgb, var(--lime) 7%, var(--surface-2)); }
.tp-mon:disabled { cursor: default; }
.tp-mon .tp-n { font-weight: 800; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.tp-mon.on .tp-d { color: var(--ink-2); }
.tp-mon .tp-d { grid-column: 2; font-size: 12px; color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; }
.tp-badge { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center;
  font: 800 12px/1 var(--mono); background: var(--win-2); color: var(--on-strong); padding: 0 6px; }
.tp-badge.lead { background: var(--accent); color: var(--accent-ink); }
.tp-foe { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.tp-foe-mon { display: flex; align-items: center; gap: 6px; background: var(--surface-2); box-shadow: var(--ring); border-radius: var(--pill); padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 800; min-width: 0; }
.tp-foe-mon small { font-weight: 500; color: var(--ink-3); }
.pl-legal ul { margin: 2px 0 8px; padding-left: 18px; font-size: 13px; }

/* ---------- game plan ("how to use this team") ---------- */
.gp { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow), var(--ring); min-width: 0; overflow-wrap: anywhere; }
.gp-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
.gp-h .eyebrow { margin-bottom: 6px; }
.gp-h h2 { font: 800 clamp(22px, 2.6vw, 28px)/1.1 var(--display); letter-spacing: -.02em; }
.gp-sum { font-size: 15px; color: var(--ink-2); max-width: 72ch; }
.gp-k { font: 800 italic 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.gp-btn { font-weight: 800; color: var(--ink); background: color-mix(in srgb, var(--lime) 22%, transparent); padding: 0 4px; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.gp-top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 880px) { .gp-top { grid-template-columns: 1fr; } }
.gp-lead { background: var(--surface-2); box-shadow: inset 5px 0 0 var(--lime), var(--ring); border-radius: var(--r); padding: 13px 16px 13px 20px; display: grid; gap: 4px; }
.gp-lead .gp-k { margin-bottom: 2px; }
.gp-lead-n { font: 800 20px/1.15 var(--display); }
.gp-lead-t { font-size: 14px; color: var(--ink-2); }
.gp-gim-box { min-width: 0; }
.gp-gims { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.gp-gim { display: flex; align-items: center; gap: 8px; background: var(--surface-2); box-shadow: var(--ring); border-radius: var(--pill); padding: 5px 14px 5px 5px; min-width: 0; max-width: 100%; }
.gp-gim-t { display: grid; line-height: 1.25; min-width: 0; }
.gp-gim-t b { font-size: 13px; font-weight: 800; }
.gp-gim-t span { font-size: 12px; color: var(--ink-3); }

.gp-members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.gp-m { box-shadow: var(--ring); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 9px; align-content: start; background: var(--surface-2); min-width: 0; }
.gp-m-h { display: flex; align-items: flex-start; gap: 10px; }
.gp-m-title { flex: 1; min-width: 0; }
.gp-m-title h4 { font: 800 18px/1.2 var(--display); letter-spacing: -.01em; }
.gp-lead-tag { margin: 0 0 0 4px; vertical-align: 2px; }
.gp-role { font: 800 italic 13px/1.3 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.gp-num { flex: none; width: 26px; height: 26px; display: grid; place-items: center; font: 800 13px/1 var(--display); background: var(--lime); color: var(--lime-ink); border-radius: 50%; }
.gp-types { display: flex; flex-wrap: wrap; gap: 4px; }
.gp-job { font-size: 14px; color: var(--ink-2); }

.gp-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; counter-reset: gp-step; }
.gp-steps li { position: relative; padding-left: 30px; font-size: 14px; line-height: 1.45; counter-increment: gp-step; }
.gp-steps li::before { content: counter(gp-step); position: absolute; left: 0; top: 1px; width: 21px; height: 21px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); font: 800 12px/21px var(--mono); text-align: center; }

.gp-facts { margin: 0; display: grid; gap: 7px; border-top: 1px dashed var(--line); padding-top: 9px; }
.gp-facts div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.gp-facts dt { font: 800 italic 12px/1.7 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.gp-facts dd { margin: 0; color: var(--ink-2); }
.gp-weak { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
@media (max-width: 420px) { .gp-facts div { grid-template-columns: 1fr; gap: 2px; } }

.gp-sec { display: grid; gap: 10px; }
.gp-sec h3 { display: flex; align-items: center; gap: 9px; font: 800 italic 20px/1.2 var(--label); letter-spacing: .05em; text-transform: uppercase; }
.gp-sec h3::before { content: ""; flex: none; width: 6px; height: 18px; border-radius: 3px; background: var(--grad); transform: skewX(-14deg); }
.gp-mu { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gp-mu li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.gp-mu li:last-child { border-bottom: 0; padding-bottom: 0; }
.gp-mu-dot { display: inline-block; width: 44px; height: 8px; margin-top: 7px; border-radius: var(--pill); background: var(--neutral); }
.gp-mu-t { display: grid; gap: 2px; min-width: 0; }
.gp-arrow { margin: 0 6px; color: var(--ink-3); }
.gp-arrow::before { content: "\2192"; }
.gp-mu-x { color: var(--ink-2); font-size: 13px; }
.gp-tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.gp-tips li::marker { color: var(--lime); }

/* compact: lead + gimmicks + collapsed steps */
.gp-compact { gap: 12px; }
.gp-list { display: grid; gap: 6px; }
.gp-d { box-shadow: var(--ring); border-radius: var(--r); padding: 0 14px; background: var(--surface-2); }
.gp-d[open] { padding-bottom: 12px; display: grid; gap: 8px; }
.gp-d summary { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 9px 0; list-style: none; flex-wrap: wrap; }
.gp-d summary::-webkit-details-marker { display: none; }
.gp-d summary::after { content: "+"; margin-left: auto; font: 700 16px/1 var(--mono); color: var(--ink-3); }
.gp-d[open] summary::after { content: "\2212"; }
.gp-d summary b { font: 800 15px/1.2 var(--display); }
.gp-d .gp-role { margin-top: 0; }

/* Gauntlet */
.gt-intro, .gt-slots, .gt-edit, .gt-ladder { display: grid; gap: 16px; }
.gt-reels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .gt-reels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gt-reel { display: grid; justify-items: center; gap: 8px; padding: 12px 8px; border: 2px solid var(--line-2); border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--surface-2), var(--surface)); text-align: center; font-size: 13px; }
.gt-reel b { font: 800 14px/1.2 var(--display); }
.gt-window { width: 100%; height: 108px; display: grid; place-items: center; overflow: hidden; border-radius: var(--r);
  background: repeating-linear-gradient(0deg, #1a1530 0 18px, #221b3a 18px 36px); box-shadow: inset 0 8px 12px rgba(0,0,0,.45), inset 0 -8px 12px rgba(0,0,0,.45); }
.gt-reel.spin .gt-window { box-shadow: inset 0 8px 12px rgba(0,0,0,.45), inset 0 -8px 12px rgba(0,0,0,.45), inset 0 0 0 2px var(--lime); }
.gt-reel.spin .gt-window .spr { animation: gt-roll .07s linear infinite; filter: blur(1.5px); }
@keyframes gt-roll { from { transform: translateY(-30%); } to { transform: translateY(30%); } }
.gt-reel:not(.spin) .gt-window .spr { animation: gt-land .35s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes gt-land { from { transform: translateY(-40%); } to { transform: translateY(0); } }
.gt-q { font: 800 40px/1 var(--display); color: var(--ink-3); }
.gt-mons { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.gt-mons select { width: 100%; }
.gt-movesel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.gt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gt-list li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 9px 14px;
  border-radius: var(--r); background: var(--surface-2); box-shadow: var(--ring); }
.gt-t b { font: 800 16px/1.2 var(--display); }
.gt-list li.now { background: color-mix(in srgb, var(--lime) 6%, var(--surface-2)); box-shadow: inset 0 0 0 2px var(--lime); }
.gt-list li.locked { opacity: .6; background: var(--surface); }
.gt-list li:last-child .gt-t b { color: var(--scarlet); }
.gt-n { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); box-shadow: var(--ring); font: 800 15px/1 var(--display); }
.gt-list li.beat .gt-n { background: var(--lime); color: var(--lime-ink); box-shadow: none; }
.gt-list li.now .muted { color: var(--ink-2); }
.gt-list li.now .gt-n { background: var(--grad-btn); color: #fff; box-shadow: none; }
.gt-t { display: grid; justify-items: start; }
.gt-bonus { margin-top: 4px; padding: 2px 10px; border-radius: var(--pill); font-size: 12px; font-weight: 800; color: #fff; background: #7b3fe4; }
.gt-elo { font: 600 13px var(--mono); color: var(--ink-2); }
.gt-ok { color: var(--lime); font: 800 italic 15px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; }
.gt-ok::before { content: "✓ "; }
.gt-lost { border-color: var(--loss-2); }
.gt-vs { margin: 0 0 12px; font-weight: 700; }
.gt-vs b { font: 800 italic 17px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--lime); margin-right: 4px; }

/* intro: the two kinds of run side by side (stacked on phones) */
.gt-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 12px; }
.gt-modes .pl-card { display: flex; flex-direction: column; gap: 8px; }
.gt-modes .pl-start { margin-top: auto; }
/* the two runs as big S/V tiles with a Pokémon peeking in */
.gt-mode { position: relative; overflow: hidden; min-height: 230px; padding: 20px 22px; color: #fff; box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, .08); }
.gt-modes .gt-mode-ou { background: linear-gradient(135deg, #d63d24, #b01e30); } /* beats .pl-card (play.css loads later) */
.gt-modes .gt-mode-champ { background: linear-gradient(135deg, #8e4bf5, #5b23c9); }
.gt-mode::before { content: ""; position: absolute; right: -50px; top: -50px; width: 200px; height: 200px; border-radius: 50%; border: 20px solid rgba(255, 255, 255, .14); }
.gt-mode img { position: absolute; right: -10px; bottom: -18px; height: 190px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); pointer-events: none; }
.gt-mode .pl-card-t { position: relative; font-size: 30px; color: #fff; }
.gt-mode .pl-card-t::before { background: #fff; }
.gt-mode p { position: relative; max-width: 58%; color: #fff; font-weight: 700; }
.gt-mode .pl-start { position: relative; align-self: flex-start; background: var(--lime); color: var(--lime-ink); box-shadow: 0 6px 0 rgba(0, 0, 0, .22), 0 0 24px rgba(217, 255, 61, .3); }
.gt-mode .pl-start:hover:not(:disabled) { background: var(--lime); filter: brightness(1.05); box-shadow: 0 7px 0 rgba(0, 0, 0, .22), 0 0 28px rgba(217, 255, 61, .4); }

/* gauntlet / daily switch and the finished-daily screen */
.gt-wrap { display: grid; gap: 14px; }
.gt-slot-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.gt-slot-bar .seg { width: min(100%, 320px); }
.gt-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--scarlet); vertical-align: middle; margin-left: 2px; }
.gt-streak b { font-size: 15px; color: var(--lime); }
.gt-daily-done { display: grid; gap: 14px; }
.gt-daily-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.gt-daily-stats div { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); box-shadow: var(--ring); }
.gt-daily-stats b { font-size: 24px; }
.gt-daily-stats span { font-size: 12px; color: var(--ink-3); }

/* Daily challenge */
.gt-challenge { display: grid; gap: 14px; }
.gt-rules { margin: 0; padding-left: 18px; display: grid; gap: 2px; color: var(--ink-2); }
.gt-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.gt-won { border-color: var(--lime); }
.gt-sides .pl-mons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gt-leadpick li { padding: 0; background: none; box-shadow: none; }
.gt-lead { width: 100%; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 10px 3px 3px; border: 0; border-radius: var(--pill); cursor: pointer;
  background: var(--surface); box-shadow: var(--ring); color: var(--ink); font: inherit; font-size: 13px; font-weight: 800; text-align: left; }
.gt-lead > span:not(.spr) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-lead i { font-style: normal; font-weight: 500; color: var(--ink-3); }
.gt-lead:hover { background: var(--surface-2); }
.gt-lead.on { box-shadow: inset 0 0 0 2px var(--lime); }
.gt-lead-tag { flex: none; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--lime-ink); background: var(--lime); padding: 2px 6px; border-radius: var(--pill); }

/* Nuzlocke gauntlet */
.gt-reels-many { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 760px) { .gt-reels-many { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gt-reels-many .gt-window { height: 86px; }
.gt-nuz, .gt-nuz-intro { display: grid; gap: 14px; }
.gt-box { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 6px; }
.gt-boxmon { width: 100%; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 8px 3px 3px; border: 0; border-radius: var(--pill); cursor: pointer;
  background: var(--surface-2); box-shadow: var(--ring); color: var(--ink); font: inherit; font-size: 13px; font-weight: 800; text-align: left; }
.gt-boxmon > span:not(.spr) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-boxmon .spr-sm { flex: none; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 50% 55%, #33504c 0 62%, transparent 63%); }
.gt-boxmon:hover:not(:disabled) { background: var(--surface); }
.gt-boxmon:disabled { cursor: default; }
.gt-boxmon.on { box-shadow: inset 0 0 0 2px var(--lime); }
.gt-boxmon.dead { opacity: .45; filter: grayscale(1); }
.gt-boxtag { flex: none; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--lime-ink); background: var(--lime); padding: 2px 6px; border-radius: var(--pill); }
.gt-boxtag.dead { color: #fff; background: var(--loss-2); }
.gt-slot-bar .seg { width: min(100%, 440px); }

/* Home screen (src/ui/home.js): Scarlet/Violet split hero, continue + team cards, mode tiles */
.home { display: grid; gap: 16px; }

.home-hero { position: relative; height: 270px; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow);
  background: linear-gradient(115deg, #d63d1f 0 49.6%, #6a2fd0 50.4% 100%); }
.home-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background:
  radial-gradient(circle at 24% 115%, rgba(255, 255, 255, .13) 0 110px, transparent 111px),
  radial-gradient(circle at 78% -12%, rgba(255, 255, 255, .11) 0 130px, transparent 131px),
  radial-gradient(rgba(255, 255, 255, .22) 1px, transparent 1.2px) 0 0 / 22px 22px; }
.home-hero img { position: absolute; bottom: -22px; height: 300px; filter: drop-shadow(0 14px 20px rgba(0, 0, 0, .35)); }
.home-hero-l { left: -8px; }
.home-hero-r { right: -8px; transform: scaleX(-1); }
.home-hero-t { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(50%, 520px); text-align: center; color: #fff; }
.home-hero-t h1 { font: 800 italic 52px/.95 var(--label); text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 3px 0 rgba(0, 0, 0, .22); }
.home-hero-t p { margin: 10px auto 16px; font-weight: 700; font-size: 15px; max-width: 360px; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
.home-cta { border: 0; cursor: pointer; background: var(--lime); color: var(--lime-ink); font: 800 italic 20px/1 var(--label); letter-spacing: .06em;
  text-transform: uppercase; padding: 12px 28px; border-radius: var(--pill); box-shadow: 0 6px 0 rgba(0, 0, 0, .22), 0 0 24px rgba(217, 255, 61, .35); }
.home-cta:hover { filter: brightness(1.05); transform: translateY(-1px); }
.home-cta:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0, 0, 0, .22); }

.home-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.home-card { position: relative; display: grid; align-content: start; gap: 8px; padding: 18px 20px 20px; border-radius: var(--r-lg);
  background: var(--surface); box-shadow: var(--shadow), var(--ring); min-width: 0; }
.home-cont { background: linear-gradient(135deg, #2c2349, #1a1530); }
.home-card h2 { font: 800 22px/1.15 var(--display); letter-spacing: -.01em; }
.home-slant { width: fit-content; font: 800 italic 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; background: var(--lime);
  color: var(--lime-ink); padding: 5px 14px 4px; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.home-slant.violet { background: #7b3fe4; color: #fff; }
.home-sub { color: var(--ink-2); font-size: 14px; max-width: 46ch; overflow-wrap: anywhere; }
.home-ladder { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin: 4px 0 2px; }
.home-ladder i { height: 8px; border-radius: 4px; background: #3a3060; }
.home-ladder i.b { background: var(--lime); }
.home-ladder i.n { background: var(--scarlet); box-shadow: 0 0 0 3px rgba(255, 106, 72, .3); }
.home-mons { display: flex; flex-wrap: wrap; gap: 2px; min-height: 48px; padding-right: 110px; }
.home-mons img { width: 48px; height: 48px; object-fit: contain; }
.home-go { position: absolute; right: 16px; bottom: 16px; border: 0; cursor: pointer; background: #fff; color: var(--lime-ink); font: 800 14px var(--body);
  padding: 9px 16px; border-radius: var(--pill); box-shadow: 0 4px 0 rgba(0, 0, 0, .25); }
.home-go:hover { background: var(--lime); }
.home-team .home-sub { padding-right: 120px; }

.home-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.home-tile { position: relative; overflow: hidden; height: 128px; border: 0; cursor: pointer; text-align: left; display: grid; align-content: start;
  gap: 4px; padding: 14px 16px; border-radius: var(--r-lg); color: #fff; background: var(--mc); box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, .08); }

.home-tile img { position: absolute; right: -6px; bottom: -14px; height: 112px; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .3)); transition: transform var(--t-med) var(--ease-out); }

@media (max-width: 1100px) {

}

  .home-tile img, .home-cta { transition: none; }
  .home-tile:hover img, .home-cta:hover { transform: none; }
}
/* an odd tile out fills the last row */
.home-tile:last-child:nth-child(3n+1) { grid-column: 1 / -1; }

/* Play online */
.ol { display: grid; gap: 16px; }
.ol-start { display: grid; gap: 16px; max-width: 880px; }
.ol-start .field input { width: 100%; max-width: 340px; box-sizing: border-box; }
.ol-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .ol-choices { grid-template-columns: 1fr; } }
.ol-choices .pl-card { position: relative; overflow: hidden; align-content: start; padding: 20px 22px; box-shadow: var(--ring), var(--shadow); }
.ol-choices .pl-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 106, 72, .22), transparent 70%); }

.ol-choices .btn { justify-self: start; }
.ol-code-in { font: 700 26px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; max-width: 280px;
  padding: 14px 12px 14px 20px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line-2); color: var(--lime); }
.ol-code-in::placeholder { font: 600 15px/1 var(--body); letter-spacing: .02em; text-transform: none; color: var(--ink-3); }

/* Room */
.ol-bar { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px 14px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--ring), var(--shadow); }
.ol-bar::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--grad); }
.ol-code { display: flex; align-items: center; gap: 12px; }
.ol-code b { font: 800 28px/1 var(--mono); letter-spacing: .2em; color: var(--lime); padding: 6px 10px 6px 16px; border-radius: var(--r); background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-2); }
.ol-people { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; }
.ol-people li { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: var(--pill); background: var(--surface-2); box-shadow: var(--ring); font-size: 14px; font-weight: 700; max-width: 260px; }
.ol-role { flex: none; font: 800 italic 12px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px 4px; border-radius: var(--pill); background: var(--line-2); color: var(--ink); }
.ol-p1 .ol-role, .ol-p2 .ol-role { background: var(--lime); color: var(--lime-ink); }
.ol-you { font-size: 13px; color: var(--ink-2); }
.ol-lobby { display: grid; gap: 16px; }
.ol-status { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.ol-status.ok { color: var(--lime); }

/* Battle */
.ol-battle { display: grid; gap: 14px; }
.ol-battle-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.ol-battle-h h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.02em; }
.ol-battle-h .btn { margin-left: auto; }
.ol-scene { max-width: 760px; }
.ol-ctl { display: grid; gap: 12px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--ring), var(--shadow); max-width: 760px; }
.ol-ctl h3 { margin: 2px 0 0; display: flex; align-items: center; gap: 9px; font: 800 italic 17px/1.1 var(--label); letter-spacing: .06em; text-transform: uppercase; }
.ol-ctl h3::before { content: ""; flex: none; width: 6px; height: 16px; border-radius: 3px; background: var(--grad); transform: skewX(-14deg); }
.ol-moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ol-move { --tc: var(--violet); display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; }
.btn.ol-move { border-radius: var(--r); min-height: 64px; padding: 10px 14px 10px 18px; color: var(--ink); font-weight: 700;
  box-shadow: inset 6px 0 0 var(--tc), inset 0 0 0 1px color-mix(in srgb, var(--tc) 45%, var(--line));
  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 22%, var(--surface-2)), var(--surface-2) 70%); }
.btn.ol-move:hover:not(:disabled) { box-shadow: inset 6px 0 0 var(--tc), inset 0 0 0 1px color-mix(in srgb, var(--tc) 70%, var(--line));
  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 22%, var(--surface-2)), color-mix(in srgb, var(--tc) 10%, var(--surface-2)) 70%); }
.ol-z .btn.ol-move { box-shadow: inset 6px 0 0 var(--lime), inset 0 0 0 2px var(--lime); }
.ol-gims { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.ol-gim { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 6px; border-radius: var(--pill); background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line-2);
  font: 800 italic 15px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.ol-gim:has(input:checked) { background: var(--lime); color: var(--lime-ink); box-shadow: 0 0 16px rgba(217, 255, 61, .3); }
.ol-gim input { accent-color: var(--lime-ink); margin: 0; }
.ol-mons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
@media (max-width: 520px) { .ol-mons, .ol-moves { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ol-mon { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 14px 4px 4px; border: 0; border-radius: var(--pill); background: var(--surface-2);
  box-shadow: var(--ring), 0 2px 0 var(--btn-shadow); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; }
.ol-mon .spr { flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 72%); }
.ol-mon:hover { box-shadow: inset 0 0 0 1px var(--ink-3), 0 2px 0 var(--btn-shadow); }
.ol-mon.on { box-shadow: inset 0 0 0 2px var(--lime), 0 0 16px rgba(217, 255, 61, .25); }
.ol-tipwrap > .ol-mon { width: 100%; }
.ol-mon > span:not(.spr) { min-width: 0; line-height: 1.15; overflow-wrap: anywhere; }
.ol-mon small { white-space: nowrap; }
.ol-num { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); font: 800 12px/1 var(--mono); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.ol-slot { margin: 0; color: var(--ink-2); }
.ol-wait { margin: 0; padding: 14px 18px; border: 2px dashed var(--line-2); border-radius: var(--r-lg); color: var(--ink-2); font-weight: 700; max-width: 760px; }
.ol-end { display: grid; gap: 10px; justify-items: start; max-width: 760px; padding: 18px 20px; border-radius: var(--r-lg); background: var(--surface-2);
  box-shadow: inset 0 4px 0 var(--lime), var(--shadow), var(--ring); }
.ol-end p { margin: 0; }
.ol-end p b { font: 800 italic 32px/1 var(--label); letter-spacing: .03em; text-transform: uppercase; }

/* Draft */

.dr-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.dr-h h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.02em; }
.dr-step { margin: 0; padding: 7px 14px 6px; border-radius: var(--pill); background: var(--lime); color: var(--lime-ink); font: 800 italic 16px/1 var(--label); letter-spacing: .05em; text-transform: uppercase; }
.dr-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.dr-mon { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr auto auto 1fr; align-items: center; column-gap: 8px;
  min-width: 0; padding: 4px 14px 4px 4px; border: 0; border-radius: var(--pill); background: var(--surface-2); box-shadow: var(--ring), 0 2px 0 var(--btn-shadow);
  color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; line-height: 1.15; cursor: pointer; text-align: left; }
.dr-mon .spr { grid-row: 1 / -1; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 72%); }
.dr-mon > span:not(.spr) { grid-row: 2; grid-column: 2; overflow-wrap: anywhere; }
.dr-mon small { grid-row: 3; grid-column: 2; }
.dr-mon:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--ink-3), 0 2px 0 var(--btn-shadow); }
.dr-mon:disabled { cursor: default; }
.dr-mon small { font-size: 11px; font-weight: 800; color: var(--ink-2); }
.dr-mon.sel { box-shadow: inset 0 0 0 2px var(--lime), 0 0 18px rgba(217, 255, 61, .3); }
.dr-mon.banned { opacity: .4; text-decoration: line-through; }
.dr-mon.dr-p1 { box-shadow: inset 0 0 0 2px var(--win-2); background: color-mix(in srgb, var(--win-2) 18%, var(--surface-2)); }
.dr-mon.dr-p2 { box-shadow: inset 0 0 0 2px var(--loss-2); background: color-mix(in srgb, var(--loss-2) 18%, var(--surface-2)); }
.dr-mon.dr-p1 small, .dr-mon.dr-p2 small { color: var(--ink); }
.dr-team.dr-p1 { box-shadow: inset 0 4px 0 var(--win-2), var(--ring); }
.dr-team.dr-p2 { box-shadow: inset 0 4px 0 var(--loss-2), var(--ring); }
.dr-pickbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--ring); }
.dr-pickbar .hint { flex-basis: 100%; margin: 0; }
.dr-order { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.dr-order li { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font: 800 12px/1 var(--mono); color: #fff; opacity: .55; }
.dr-order .dr-o-p1 { background: var(--win-2); color: var(--lime-ink); }
.dr-order .dr-o-p2 { background: var(--loss-2); color: var(--lime-ink); }
.dr-order .now { opacity: 1; background: var(--lime); color: var(--lime-ink); outline: 2px solid var(--lime); outline-offset: 2px; }
.dr-order .done { opacity: .25; }
.dr-rps-b { min-width: 96px; }
.dr-builds { display: grid; gap: 12px; }
.dr-bt { display: flex; align-items: center; gap: 6px; }
.dr-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.dr-opt { display: grid; gap: 3px; text-align: left; padding: 10px 14px; border: 0; border-radius: var(--r); background: var(--surface-2); box-shadow: var(--ring); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
.dr-opt:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.dr-opt.on { box-shadow: inset 0 0 0 2px var(--lime); }
.dr-src { justify-self: start; font: 800 italic 12px/1 var(--label); letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px 2px; border-radius: var(--pill); background: var(--lime); color: var(--lime-ink); }

/* Auction */
.au-mods { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.au-mods .chip.off { opacity: .55; text-decoration: line-through; }
.au-coins { flex: none; padding: 5px 12px 4px; border-radius: var(--pill); background: var(--lime); color: var(--lime-ink); font: 700 14px/1 var(--mono); box-shadow: 0 0 14px rgba(217, 255, 61, .2); }
.au-lot { position: relative; overflow: hidden; display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 12px 22px; padding: 22px 24px;
  border-radius: var(--r-lg); background: radial-gradient(120% 140% at 12% 50%, rgba(163, 107, 255, .28), transparent 55%), var(--surface);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--violet) 55%, var(--line)), var(--shadow); }
.au-lot > .spr { width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 70%); box-shadow: 0 10px 24px rgba(0, 0, 0, .45); }
.au-lot .spr-lg { width: 128px; height: 128px; }
.au-lot-info { min-width: 0; }
.au-lot-info h3 { margin: 0; font: 800 30px/1.1 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.au-bid { margin: 6px 0 10px; font-size: 16px; }
.au-bid b { color: var(--lime); font: 700 22px/1 var(--mono); }

.au-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }

.au-tier { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; font: 800 italic 28px/1 var(--label); color: #111; transform: skewX(-8deg); box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
.au-tier.au-sm { width: 22px; height: 22px; font-size: 14px; border-radius: 6px; box-shadow: none; }
.au-tS { background: #ff5f5f; } .au-tA { background: #ff9f40; } .au-tB { background: #ffd84a; } .au-tC { background: #7bd88f; } .au-tD { background: #6fb7ff; }
.au-next { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.au-n { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 2px; border-radius: var(--pill); background: var(--surface-2); box-shadow: var(--ring); font-size: 13px; font-weight: 700; }

.pl-mons li i { font-style: normal; color: var(--lime); font-family: var(--mono); }
@media (max-width: 560px) { .au-lot { grid-template-columns: auto minmax(0, 1fr); } .au-lot > .spr { display: none; } }

/* Online battle: log, teams, hints (like Battle the AI) */
.ol-cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 1000px) { .ol-cols { grid-template-columns: 1fr; } }
.ol-main { display: grid; gap: 14px; min-width: 0; }
.ol-side { display: grid; gap: 14px; }
.ol-side .box { padding: 12px 14px; box-shadow: var(--ring), var(--shadow); }
.ol-side h3 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font: 800 italic 16px/1.1 var(--label); letter-spacing: .06em; text-transform: uppercase; }
.ol-side h3::before { content: ""; flex: none; width: 5px; height: 14px; border-radius: 3px; background: var(--grad); transform: skewX(-14deg); }
.ol-log { max-height: 320px; overflow: auto; font-size: 13px; }
.ol-hints-t { margin-left: auto; font-size: 13px; }
.ol-battle-h .ol-hints-t + .btn { margin-left: 0; }
.ol-move { flex-direction: column; align-items: stretch; gap: 4px; }
.ol-move-t, .ol-move-s { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; }
.ol-move-s { flex-wrap: wrap; row-gap: 2px; }
.ol-move-s .muted, .ol-dmg > span { white-space: nowrap; }
.ol-move-t b { font: 800 italic 18px/1.1 var(--label); letter-spacing: .04em; text-transform: uppercase; }
.ol-move-s .muted { color: var(--ink-2); font-family: var(--mono); font-size: 11px; }
.ol-dmg { display: inline-flex; gap: 6px; font-weight: 800; color: var(--ink); font-family: var(--mono); }
.ol-dmg .mko { color: #ffd84a; }

.ol-mon-d { border-top: 1px solid var(--line); padding: 4px 0; }
.ol-mon-d:first-of-type { border-top: 0; }
.ol-mon-d summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; border-radius: var(--pill); padding: 1px 6px 1px 1px; }
.ol-mon-d summary:hover { background: var(--surface-2); }
.ol-mon-d summary::-webkit-details-marker { display: none; }
.ol-mon-d .spr-sm { width: 30px; height: 30px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--line-2), var(--bg) 72%); }
.ol-mon-d.fnt { opacity: .45; }
.ol-mon-d.act .ol-mon-n { color: var(--lime); }
.ol-mon-n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-mon-d p { margin: 2px 0 2px 38px; }
.ol-movelist { margin: 0 0 4px 38px; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 12px; color: var(--ink-2); }
.ol-hp { flex: none; width: 60px; height: 7px; border-radius: var(--pill); background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.ol-hp span { display: block; height: 100%; border-radius: var(--pill); }
.ol-st { font: 800 10px/1 var(--mono); padding: 3px 5px; border-radius: var(--pill); background: var(--loss-1); color: var(--ink); }
.ol-scene { max-width: none; }
.ol-ctl, .ol-wait, .ol-end { max-width: none; }
.ol-lead { flex: none; margin-left: auto; font: 800 italic 11px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px 2px; border-radius: var(--pill); background: var(--lime); color: var(--lime-ink); }
.ol-scene { position: relative; }
.ol-scene-bad { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 20px; text-align: center; background: color-mix(in srgb, var(--surface) 92%, transparent); border-radius: var(--r-lg); }
.ol-scene-fix { margin: -6px 0 0; }
.linkish { background: none; border: 0; padding: 0; color: var(--violet-ink); font: inherit; text-decoration: underline; cursor: pointer; }
.linkish:hover { color: var(--lime); }
.ol-wait { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ol-away { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; } .ol-away p { margin: 0; }
.ol-tipwrap { display: block; min-width: 0; }
.ol-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ol-battle .pl-tip .pl-tip-res { display: grid; gap: 2px; }
.ol-field { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ol-tipwrap-i { display: inline-block; }
.ol-fchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: var(--pill); background: var(--surface-2); box-shadow: var(--ring); font-size: 13px; font-weight: 700; cursor: help; }

.ol-fchip .spr-sm { width: 28px; height: 28px; }
.ol-fvs { color: var(--ink-3); font: 800 italic 13px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; }
.ol-bst { font-size: 11px; font-weight: 800; }
.ol-bst.up, .ol-now.up, .ol-stg.up, .ol-os.good { color: #3ec46d; }
.ol-bst.down, .ol-now.down, .ol-stg.down, .ol-os.bad { color: #ff5f5f; }
.ol-os.mid { color: #ffd84a; }
.ol-live { border-collapse: collapse; font-size: 13px; }
.ol-live th { text-align: left; font-weight: 700; color: var(--ink-2); padding: 1px 12px 1px 0; }
.ol-live td { padding: 1px 10px 1px 0; font-variant-numeric: tabular-nums; }
.ol-now { font-weight: 800; }
.ol-takes { display: flex; flex-wrap: wrap; gap: 4px 10px; }
